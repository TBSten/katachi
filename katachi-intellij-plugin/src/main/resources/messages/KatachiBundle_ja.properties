# ---- notification.rules.* / popup.rules.*: 当たる Role が無いファイルの通知（ide-display-rules-for-file） ----
# プラグインは katachi-baseline.json を読む。baseline が許容するファイルは baselineHeld の弱い印、baseline を読めて（または baseline が無く）許容されていなければ *.sure の断定、
# 読めない（ファイルが無い・知らない "version"・壊れている）ときは下の条件付きの文言のまま。
notification.rules.noRole=当たる Role がありません。baseline で抑えていなければ、テストで UnexpectedFile になります。
notification.rules.noRole.sure=当たる Role がありません。テストで UnexpectedFile になります。
notification.rules.noRole.untracked.sure=当たる Role がありません。git に追加すると、テストで UnexpectedFile になります。
notification.rules.baselineHeld=baseline で許容中（{0}）。新しい違反ではありません。
notification.rules.noRole.untracked=当たる Role がありません。git に追加すると、baseline で抑えていなければテストで UnexpectedFile になります。
notification.rules.noRole.nearby=近い Role: {0}（{1}）
notification.rules.noRole.stale=（定義が古い）
notification.rules.noRole.unexpectedUnder=知られていないディレクトリの下: {0}（UnexpectedDirectory）
# katachi の [CaptureMismatch] ブロックの 1 行目と同じ文。{1} は値が揃わなかった名前（capture("feature")）。
notification.rules.captureMismatch=Role {0} のパターンに当たりますが、{1} で名付けた階層の値が揃っていません。baseline で抑えていなければ、テストで CaptureMismatch になります。
notification.rules.captureMismatch.sure=Role {0} のパターンに当たりますが、{1} で名付けた階層の値が揃っていません。テストで CaptureMismatch になります。
