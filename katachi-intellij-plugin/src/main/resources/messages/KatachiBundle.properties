# ---- notification.rules.* / popup.rules.*: the notification on a file no role holds (ide-display-rules-for-file) ----
# The plugin reads katachi-baseline.json. A file it holds back gets the weak baselineHeld note; when the baseline is read (or there is none) and does not hold the file the *.sure wording is used;
# when it could not be read (missing, an unknown "version", broken) the conditional wording below stays.
notification.rules.noRole=No role allows this file. The test reports it as UnexpectedFile unless the baseline holds it back.
notification.rules.noRole.sure=No role allows this file. The test reports it as UnexpectedFile.
notification.rules.noRole.untracked.sure=No role allows this file. Once you add it to git, the test reports it as UnexpectedFile.
notification.rules.baselineHeld=Held back by the baseline ({0}). This is not a new violation.
notification.rules.noRole.untracked=No role allows this file. Once you add it to git, the test reports it as UnexpectedFile unless the baseline holds it back.
notification.rules.noRole.nearby=Nearest role: {0} ({1})
notification.rules.noRole.stale=(stale definition)
notification.rules.noRole.unexpectedUnder=Under a directory no role knows: {0} (UnexpectedDirectory)
# The first line of katachi's [CaptureMismatch] block, word for word; {1} is the names whose levels disagree (`capture("feature")`).
notification.rules.captureMismatch=The file matches a pattern of role {0}, but the levels named by {1} do not agree. The test reports it as CaptureMismatch unless the baseline holds it back.
notification.rules.captureMismatch.sure=The file matches a pattern of role {0}, but the levels named by {1} do not agree. The test reports it as CaptureMismatch.
notification.rules.captureMismatch.moveTo=Move it to {0}
notification.rules.nearbyRoles=Nearby roles\u2026
notification.rules.openDefinition=Open definition
notification.rules.dismiss.tooltip=Dismiss the notification for this file
