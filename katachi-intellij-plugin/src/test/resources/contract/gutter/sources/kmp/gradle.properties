# Reuse outputs of previous builds.
org.gradle.caching=true
org.gradle.configuration-cache=true
# Without this the build daemon dies while AGP 9 runs its Android tasks:
# "Gradle build daemon disappeared unexpectedly". Gradle's defaults (-Xmx512m,
# -XX:MaxMetaspaceSize=384m) are not enough for AGP + the Kotlin compiler + kotest.
# This is the sample's own value; the katachi build included with `includeBuild` does not
# supply it to this build.
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g

android.useAndroidX=true
