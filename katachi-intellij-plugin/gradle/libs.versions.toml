[versions]
intellijPlatformGradlePlugin = "2.18.1"
intellijIdea = "2026.1"
kotlin = "2.3.0"
composeMultiplatform = "1.9.0"
jewel = "0.37.0"
jewelForIde = "261.26222.65"
junit4 = "4.13.2"
junitJupiter = "5.11.4"
junitPlatformLauncher = "1.11.4"
kodein = "7.20.2"
kotlinxCoroutines = "1.10.1"
kotlinStdlibStarter = "2.3.20-RC2"
kotest = "6.1.11"
composeUiTest = "1.10.0"

[libraries]
junit4 = { module = "junit:junit", version.ref = "junit4" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter", version.ref = "junitJupiter" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher", version.ref = "junitPlatformLauncher" }
kodein-di = { module = "org.kodein.di:kodein-di-jvm", version.ref = "kodein" }
kotlin-stdlib-starter = { module = "org.jetbrains.kotlin:kotlin-stdlib", version.ref = "kotlinStdlibStarter" }
compose-ui-test-junit4 = { module = "org.jetbrains.compose.ui:ui-test-junit4", version.ref = "composeUiTest" }
kotest-property = { module = "io.kotest:kotest-property", version.ref = "kotest" }
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core-jvm", version.ref = "kotlinxCoroutines" }

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
compose-multiplatform = { id = "org.jetbrains.compose", version.ref = "composeMultiplatform" }
