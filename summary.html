<style>/* katachi — component styles.
   Mirrors Starlight 0.42 + starlight-theme-nova 0.12 + docs/src/styles (custom-global.css, home.css, code-comparison.css).

   800px = bp-md, 1152px = bp-lg, 1120px = bp-code-comparison, 480px = bp-thumb, 352px = bp-xs.
   Responsive rules follow the nearest ".kt-page" container (DocsLayout / HomeLayout), which is the viewport on the real site. */

*, *::before, *::after { box-sizing: border-box; }

.kt-visually-hidden { position: absolute !important; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
.kt-icon { display: block; flex: none; }

/* ---------- Icon button / search / select ---------- */
.kt-iconbtn { display: flex; align-items: center; justify-content: center; flex: none; width: var(--icon-button); height: var(--icon-button); padding: var(--space-2); border: 0; border-radius: var(--radius-md); background: transparent; color: var(--text); cursor: pointer; text-decoration: none; transition: background-color 150ms cubic-bezier(0.4, 0, 0.2, 1), transform 150ms cubic-bezier(0.4, 0, 0.2, 1); }
.kt-iconbtn:hover { background: var(--wash); }
.kt-iconbtn:active { transform: scale(0.9); }
.kt-iconbtn:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }

.kt-search { display: flex; align-items: center; gap: var(--space-2); width: var(--icon-button); height: var(--icon-button); padding: var(--space-2); border: 0; border-radius: var(--radius-md); background: transparent; color: var(--text); font: inherit; font-size: 14px; line-height: 1.4; cursor: pointer; transition: background-color 150ms cubic-bezier(0.4, 0, 0.2, 1), transform 150ms cubic-bezier(0.4, 0, 0.2, 1); }
.kt-search:hover { background: var(--wash); }
.kt-search:active { transform: scale(0.9); }
.kt-search:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.kt-search-label, .kt-search-kbd { display: none; }
.kt-search-kbd { margin-inline-start: auto; gap: 0.25em; padding-inline: 6px; border-radius: var(--radius-sm); background: var(--bg-sunken); font-family: var(--font-sans); font-size: 12px; }

/* ---------- Prose (Markdown content) ---------- */

  background: linear-gradient(to right, var(--bg) 1rem, transparent) left center / 1.5rem 100% no-repeat local, linear-gradient(to left, var(--bg) 1rem, transparent) right center / 1.5rem 100% no-repeat local, radial-gradient(farthest-side at 0 50%, rgb(0 0 0 / 0.25), transparent) left center / 1rem 100% no-repeat scroll, radial-gradient(farthest-side at 100% 50%, rgb(0 0 0 / 0.25), transparent) right center / 1rem 100% no-repeat scroll; }
.kt-prose :is(th, td) { min-width: 4rem; padding: var(--space-2) var(--space-4); border-bottom: 1px solid var(--line); vertical-align: baseline; }

.kt-prose :is(th, td):last-child { padding-inline-end: 0; }

.kt-prose table .kt-badge { white-space: nowrap; }

/* ---------- Details ---------- */

/* ---------- Aside ---------- */
.kt-aside { --a-low: var(--note-low); --a-line: var(--note); --a-high: var(--note-high); padding: var(--space-4); border: 1px solid var(--a-line); border-radius: var(--radius-lg); background: var(--a-low); color: color-mix(in srgb, var(--a-high) 50%, var(--ink)); }

/* ---------- Steps ---------- */
.kt-steps { --bullet-size: 28px; --bullet-margin: 6px; margin: 0; padding-inline-start: 0; list-style: none; counter-reset: kt-steps; }

.kt-steps > li::after { content: ''; position: absolute; top: calc(var(--bullet-size) + var(--bullet-margin)); bottom: var(--bullet-margin); inset-inline-start: calc((var(--bullet-size) - 1px) / 2); width: 1px; background: var(--hairline-light); }

/* ---------- Tabs ---------- */
.kt-tabs-wrapper { overflow-x: auto; }

.kt-tab > a { display: flex; align-items: center; gap: var(--space-2); padding: 4.4px 20px; box-shadow: 0 2px 0 var(--line); color: var(--muted); line-height: 1.2; text-decoration: none; white-space: nowrap; outline-offset: -3px; }

/* ---------- Code (Expressive Code) ---------- */
.kt-code { position: relative; margin: 0; border: 1px solid var(--code-line); border-radius: var(--radius-none); background: var(--code-bg); color: var(--syntax-fg); font-family: var(--font-mono); }

.kt-code-copy button { position: relative; display: flex; align-items: center; justify-content: center; width: 40px; height: 40px; margin: 0; padding: 0; border: 1px solid color-mix(in srgb, var(--text) 40%, transparent); border-radius: 3.2px; background: var(--code-bg); color: var(--text); opacity: 0.75; cursor: pointer; transition: opacity 0.2s cubic-bezier(0.25, 0.46, 0.45, 0.94), background 0.2s; }

}
.kt-collapse--collapsed .kt-collapse-content { position: relative; max-height: calc(8 * 14px * 1.75 + 12px); overflow: hidden; }

.kt-collapse-icon { transition: transform 0.3s ease; }

/* ---------- Code comparison ---------- */
.kt-codecmp { display: grid; grid-template-columns: repeat(var(--code-comparison-columns, 2), minmax(0, 1fr)); gap: var(--space-4); margin-block: var(--space-4); }

/* ---------- File tree ---------- */
.kt-filetree { --x-space: 24px; display: block; padding: var(--space-4); overflow-x: auto; border: 1px solid var(--line); border-radius: var(--radius-none); background: var(--bg-sunken); color: var(--ink); font-family: var(--font-mono); font-size: 13px; line-height: 1.75; }

/* ---------- Cards ---------- */
.kt-cardgrid { display: grid; grid-template-columns: 100%; gap: var(--space-4); }

  .kt-cardgrid { grid-template-columns: 1fr 1fr; gap: var(--space-6); }

}
.kt-linkcard { position: relative; display: grid; grid-template-columns: 1fr auto; align-items: center; gap: var(--space-2); padding: var(--space-4); border: 1px solid var(--line); border-radius: var(--radius-lg); box-shadow: var(--shadow-sm); }

/* ---------- Home (top page) ---------- */
.kt-homelayout { min-height: 100vh; }

.kt-home-eyebrow { color: var(--home-muted); font-family: var(--font-mono); font-size: 11.52px; font-weight: 500; letter-spacing: 0.1em; text-transform: uppercase; }
.kt-home-pillar > p:first-child { color: var(--home-accent); font-family: var(--font-mono); font-size: 11.52px; font-weight: 500; letter-spacing: 0.1em; text-transform: uppercase; }
.kt-home-hero h1, .kt-home-agents h2, .kt-home-words span { font-family: var(--font-mono); font-weight: 800; letter-spacing: -0.07em; }
.kt-home-split-copy h2, .kt-home-cta h2 { color: var(--home-ink); font-size: clamp(1.75rem, 3.4cqw, 2.4rem); font-weight: 700; line-height: 1.4; letter-spacing: -0.035em; }

.kt-home-hero { padding-block: clamp(4.5rem, 11vh, 8.5rem) clamp(4.75rem, 10vh, 7.75rem); }
.kt-home-hero h1 { display: block; margin-top: 1.3rem; color: var(--home-ink); font-size: clamp(4.25rem, 11.5cqw, 9.25rem); line-height: 0.84; }
.kt-home-hero-line { display: block; }
.kt-home-accent { width: clamp(3.75rem, 9cqw, 6rem); height: 0.2rem; margin-top: 2.1rem; background: var(--home-accent); }
/* As built, ".kt-home :is(h1, h2, h3, p) { margin: 0 }" outranks the lead's and intro's margin-top and ".kt-home > section > *" outranks the intro's 31rem; kept that way. */
.kt-home-lead { margin-top: 1.75rem; font-size: clamp(1.25rem, 2.5cqw, 1.7rem); font-weight: 600; line-height: 1.65; letter-spacing: 0.005em; }
.kt-home-intro { max-width: 31rem; margin-top: 1rem; color: var(--home-muted); }
.kt-home-actions { display: flex; flex-wrap: wrap; gap: 1.75rem; margin-top: 2rem; font-size: 0.95rem; font-weight: 700; }
/* home.css styles "a:first-child"; each link sits alone in its <p>, so every action link gets the accent underline. */
.kt-home-actions a { border-bottom: 2px solid var(--home-accent); color: var(--home-ink); text-decoration: none; transition: color 160ms ease, border-color 160ms ease; }
.kt-home-actions a:hover { border-color: var(--home-accent); color: var(--home-ink); }
.kt-home-hero-code { max-width: 43rem; margin-top: 2.75rem; }
@media (prefers-reduced-motion: no-preference) {
  .kt-home-hero h1 { animation: kt-hero-spotlight 1150ms cubic-bezier(0.3, 0.7, 0.2, 1) both; }
  .kt-home-accent { transform-origin: left center; animation: kt-hero-rule 600ms cubic-bezier(0.16, 1, 0.3, 1) 800ms both; }
}
@keyframes kt-hero-spotlight { from { opacity: 0; clip-path: circle(0 at 15% 50%); } to { opacity: 1; clip-path: circle(125% at 15% 50%); } }
@keyframes kt-hero-rule { from { transform: scaleX(0); } to { transform: scaleX(1); } }

.kt-home-split { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); align-items: center; gap: clamp(2rem, 6cqw, 4rem); padding-block: clamp(3.5rem, 8vh, 6rem); }
.kt-home-split > * { width: 100%; min-width: 0; margin-inline: 0; }
.kt-home-split-copy { display: grid; gap: 1.15rem; color: var(--home-muted); }
.kt-home-split-copy strong { color: var(--home-ink); }
.kt-home-tree { min-width: 0; overflow: hidden; border: 1px solid var(--home-border); border-radius: var(--radius-lg); background: var(--home-panel); }
.kt-home-tree > p, .kt-home-tree > small { display: block; padding: 0.65rem 0.9rem; color: var(--home-muted); font-family: var(--font-mono); font-size: 0.75rem; line-height: 1.5; overflow-wrap: anywhere; }
.kt-home-tree > p { border-bottom: 1px solid var(--home-border); }
.kt-home-tree > small { border-top: 1px solid var(--home-border); }
.kt-home-tree > small span:first-child { color: var(--home-accent); }
.kt-home-tree > small span:last-child { color: var(--home-dim); }
.kt-home-tree .kt-code { border: 0; border-radius: 0; background: transparent; }
.kt-home-tree .kt-code pre { background: transparent; }

.kt-home-pillars { display: grid; grid-template-columns: minmax(0, 1fr) minmax(12rem, 0.75fr); gap: clamp(2rem, 7cqw, 5.5rem); padding-block: clamp(4rem, 9vh, 7rem); }
.kt-home-pillar-list { display: grid; min-width: 0; }
.kt-home-pillar { display: grid; align-content: center; gap: 0.85rem; min-width: 0; min-height: min(35rem, 65vh); transition: opacity 320ms ease; }
.kt-home-pillar h3 { font-size: clamp(1.4rem, 2.6cqw, 1.7rem); font-weight: 700; line-height: 1.5; letter-spacing: -0.025em; }
.kt-home-pillar > p:not(:first-child) { max-width: 28rem; color: var(--home-muted); }
.kt-home-pillar code:not(pre code) { padding: 2px 4px; border: 1px solid var(--line); border-radius: var(--radius-sm); background: var(--bg-muted); font-family: var(--font-mono); font-size: 13px; }
.kt-home-words { position: sticky; top: 24vh; align-self: start; display: grid; justify-items: end; gap: 0.15em; padding-top: 0.1rem; font-size: clamp(3rem, 8.6cqw, 6rem); line-height: 1.02; text-align: right; }
.kt-home-words span { color: var(--home-dim); transform: scale(0.88); transform-origin: right center; transition: color 320ms ease, transform 320ms cubic-bezier(0.22, 1, 0.36, 1); }
@container kt-page (min-width: 800.01px) {
  .kt-home-pillar { opacity: 0.3; }
  .kt-home-pillar.is-active { opacity: 1; }
  .kt-home-words span.is-active { color: var(--home-ink); transform: scale(1.08); }
}

.kt-home-agents { max-width: none !important; padding-block: clamp(6.5rem, 18vh, 12rem); background: var(--band-bg); color: var(--band-text); }
.kt-home-agents-inner { max-width: var(--home-max); margin-inline: auto; }
.kt-home-agents h2 { color: var(--band-ink); font-size: clamp(2.3rem, 6.4cqw, 4.9rem); line-height: 1.08; }
.kt-home-agents h2 em { color: var(--band-dim); font-style: normal; }
.kt-home-agents p { max-width: 30rem; margin-top: 1.65rem; }

.kt-home-cta { padding-block: clamp(5.5rem, 14vh, 9.5rem) clamp(6rem, 16vh, 10.5rem); }
.kt-home-cta > p { max-width: 30rem; margin-top: 1rem; margin-inline: 0; color: var(--home-muted); }
.kt-home-cards { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 1px; overflow: hidden; margin-top: clamp(2rem, 5vh, 3.5rem); border: 1px solid var(--home-border); border-radius: var(--radius-lg); background: var(--home-border); }
.kt-home-cards a { display: grid; gap: 0.6rem; min-height: 11rem; padding: clamp(1.5rem, 3cqw, 2.5rem) clamp(1.25rem, 2.5cqw, 2rem); background: var(--bg); color: inherit; text-decoration: none; transition: background-color 160ms ease; }
.kt-home-cards a:hover { background: var(--home-panel); }
.kt-home-cards strong { font-size: 1.05rem; }
.kt-home-cards strong span { margin-left: 0.45rem; color: var(--home-accent); font-family: var(--font-mono); font-weight: 500; }
.kt-home-cards small { color: var(--home-muted); font-size: 0.875rem; line-height: 1.8; }

@container kt-page (max-width: 800px) {
  .kt-home-hero h1 { font-size: clamp(2.7rem, 11.5cqw, 4rem); letter-spacing: -0.06em; }
  .kt-home-split, .kt-home-pillars { grid-template-columns: minmax(0, 1fr); }
  .kt-home-split--reverse > :first-child { order: 2; }
  .kt-home-pillar { min-height: auto; padding-block: 2.5rem; }
  .kt-home-words { position: sticky; top: var(--nav-height); z-index: 1; order: -1; display: flex; justify-content: space-between; align-items: center; gap: 0.5rem; width: 100%; padding-block: 0.75rem; border-bottom: 1px solid var(--home-border); background: var(--bg); font-size: clamp(1.125rem, 5cqw, 1.5rem); text-align: left; }
  .kt-home-words span { transform: none; transform-origin: center; }
  .kt-home-words span.is-active { color: var(--home-ink); }
  .kt-home-cards { grid-template-columns: minmax(0, 1fr); }
  .kt-home-cards a { min-height: auto; }
}
@container kt-page (max-width: 352px) {
  .kt-home-split-copy h2 { font-size: 1.25rem; }
  .kt-home-pillar h3 { font-size: 1.25rem; }
}
</style>
<style>
  html, body { margin: 0; background: var(--bg); color: var(--text); font-family: var(--font-sans); }
  .pv { padding: var(--space-6); max-width: 1280px; margin: 0 auto; box-sizing: border-box; }
  .wrap pre, .wrap code { white-space: pre-wrap !important; word-break: break-all; }
  .k-title { font-size: 24px; font-weight: 600; line-height: 1.2; color: var(--ink); margin: 0 0 var(--space-2); }
  .k-lead { margin: 0 0 var(--space-6); color: var(--muted); font-size: 14px; line-height: 1.6; }
  .k-h { font-size: 16px; font-weight: 600; color: var(--ink); margin: var(--space-8) 0 var(--space-3); padding-top: var(--space-4); border-top: 1px solid var(--hairline); }
  .tl { display: grid; grid-template-columns: 1fr auto 1fr auto 1fr; align-items: stretch; gap: var(--space-2); }
  .tl .card { border: 1px solid var(--line); border-radius: var(--radius-lg); padding: var(--space-3) var(--space-4); background: var(--bg); }
  .tl .card.now { border-color: var(--accent); border-width: 2px; }
  .tl .ver { font-family: var(--font-mono); font-size: 13px; color: var(--muted); margin-bottom: var(--space-1); display: flex; justify-content: space-between; gap: var(--space-2); align-items: center; }
  .tl .what { font-size: 15px; font-weight: 600; color: var(--ink); font-family: var(--font-mono); }
  .tl .note { font-size: 13px; color: var(--text); margin-top: var(--space-1); line-height: 1.5; }
  .tl .arrow { align-self: center; color: var(--muted); font-size: 20px; }
  .tbl { border-collapse: collapse; width: 100%; font-size: 13.5px; }
  .tbl th, .tbl td { border: 1px solid var(--line); padding: var(--space-2) var(--space-3); text-align: left; vertical-align: top; }
  .tbl th { background: var(--bg-muted); color: var(--ink); font-weight: 600; }
  .tbl td.n { text-align: right; font-family: var(--font-mono); white-space: nowrap; }
  .tbl code { font-family: var(--font-mono); font-size: 12.5px; background: var(--bg-muted); padding: 1px 4px; border-radius: var(--radius-sm); }
</style>
