# pnpm patch で直した依存。patches/ にある。
# - starlight-llms-txt: llms-full.txt にも `exclude` を適用し（凍結した版の写しを外す）、
#   凍結した版ごとの llms-full.txt（src/pages/[version]/llms-full.txt.ts）が使う generator を export する。
#   上流に llms-full.txt の除外の設定ができたら、この patch は消してよい。
patchedDependencies:
  starlight-llms-txt@0.12.0: patches/starlight-llms-txt@0.12.0.patch
