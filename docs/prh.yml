# 言い換え辞書（日本語のページが対象）。唯一の置き場。
# 新しく見つけた言い換えはここに足す。検査は `pnpm run lint:text`。
# 文脈で正しくも誤りにもなるもの（例: 概念の「役割」→「Role」）は入れない（AGENTS.md に書く）。
version: 1
rules:
  # 「既定」は硬い。デフォルトに統一する。「既定値」を先に書き、長い方を優先する。
  - expected: デフォルト値
    pattern: 既定値
    specs:
      - from: 既定値は 5 です
        to: デフォルト値は 5 です
  - expected: デフォルト
    pattern: 既定
    specs:
      - from: 既定の設定
        to: デフォルトの設定
      - from: 既定では無効です
        to: デフォルトでは無効です

  # テストの種類の表記をそろえる（2026-10-29 利用者の指摘）。ユニットテスト・UnitTest・unit test などは Unit test に。
  # コード（インラインコード・コードブロック）は textlint の対象外なので、`UnitTest` のような識別子はそのまま。
  - expected: Unit test
    pattern:
      - ユニットテスト
      - /[Uu]nit ?[Tt]est/
    specs:
      - from: ユニットテスト で検査する
        to: Unit test で検査する
      - from: UnitTest で検査する
        to: Unit test で検査する
      - from: unit test で検査する
        to: Unit test で検査する

  # baseline の文脈。今ある違反を許容し、新しい違反だけをエラーにする、という意味。
  - expected: 許容
    pattern: 棚上げ
    specs:
      - from: 今ある違反を棚上げする
        to: 今ある違反を許容する

  # 「台帳」は比喩で伝わりにくい。実体（ファイル）を書く。
  - expected: baseline のファイル
    pattern: 台帳
    specs:
      - from: 台帳に記録する
        to: baseline のファイルに記録する

  # 検出だけ（機械で置き換えにくい）。言い換えの案: 「プロジェクト全体を走査する」「プロジェクト内のすべてのファイルを調べる」
  # expected は案の1つ（自動修正はしない。文脈に合わせて直す）。
  - expected: プロジェクト全体を走査する
    pattern: プロジェクト全体を歩く
    prh: 「プロジェクト全体を走査する」「プロジェクト内のすべてのファイルを調べる」などに言い換える

  - expected: リファレンス
    pattern: レファレンス
    specs:
      - from: API レファレンス
        to: API リファレンス

  # 検出だけ（baseline のファイルを「縮める」）。言い換えの案: 「修正した違反を baseline のファイルから削除します」
  # expected は案の1つ（自動修正はしない。文脈に合わせて直す）。
  - expected: 修正した違反を削除します
    pattern: 縮めます
    prh: 「修正した違反を削除します」などに言い換える

  - expected: RepositoryInterface
    pattern: /Repository-interface/
    specs:
      - from: Repository-interface
        to: RepositoryInterface
  - expected: RepositoryImplementation
    pattern: /Repository-implementation/
    specs:
      - from: Repository-implementation
        to: RepositoryImplementation

  # Role の宣言は `"名前".role { }`。v0.2 までの `"名前" { }` は v0.3 からコンパイルエラーなので、例に書かない。
  # 検出だけ（Role 名は英大文字で始まる決まりなので、`"大文字始まり" {` を見る。`layout { }` の中のディレクトリ `"src" { }` は小文字始まりが普通で、当たらない）。
  # expected は案の1つ（自動修正はしない。ディレクトリの宣言に当たったら、そのまま残す）。
  - expected: '"UseCase".role {'
    pattern: /"([A-Z][A-Za-z0-9_-]*)" \{/
    prh: 'Role の宣言は `"名前".role { }` で書く。`"名前" { }` はコンパイルエラーになる形なので例に書かない'

  # 「効く」は何が起きるのかを言わない。当たる・反映される・検査される・かかる、など起きることを書く。
  # 検出だけ（言い換えは文脈で変わる）。「有効」「無効」は当てない。言い換え方は AGENTS.md の「文章の方針」。
  # expected は案の1つ（自動修正はしない。文脈に合わせて直す）。
  - expected: 当たる
    pattern: /(?<![有無])効[かきくけこい]/
    prh: 「効く」は使わない。「当たる」「反映される」「検査される」「かかる」など、何が起きるかを書く

  # IDE のエディタに出る通知のこと。「帯」では何のことか伝わらない。
  - expected: エディタの通知
    pattern: 帯
    specs:
      - from: 帯が出る
        to: エディタの通知が出る

  # 「落ちる」「落とす」は、テストや検査の結果を比喩で言っていて、何が起きるのかを言わない。
  # 文脈で言い換えが変わる（テストが落ちる→テストが失敗する、宣言・ファイルが落ちる→違反になる）が、
  # 比喩を残さないことを優先して検出する。expected はテストの失敗の場合の案（自動修正はしない。言い換え方は AGENTS.md の「文章の方針」）。
  # 「落とし穴」「落とし込む」は当てない。
  - expected: 失敗する
    pattern: /落ち(?:る|た|て|ない|ます|ません|なかった|れば)|落と(?:す|さない|した|して|します|さず)(?!穴)/
    prh: 「落ちる」「落とす」は使わない。テストなら「失敗する」「失敗させる」、宣言・ファイルなら「違反になる」と書く
    specs:
      - from: テストが落ちる
        to: テストが失敗する
      - from: 1つ落ちた
        to: 1つ失敗する

  # 「〜しか使えません」は否定で言わず、「〜のみ使用できます」と使えるものを言い切る（2026-10-31 のフィードバック 261031-008）。
  - expected: のみ使用できます
    pattern: しか使えません
    specs:
      - from: ASCII しか使えません
        to: ASCII のみ使用できます

  # 文書の区切りは「節」ではなく「セクション」と書く（2026-11-01 のフィードバック 261101-008。「節」は NG ワード）。
  # 「季節」「調節」「節約」などは当てない。
  - expected: セクション
    pattern: /(?<![季調関])節(?![約度])/
    specs:
      - from: 次の節の Role
        to: 次のセクションの Role
      - from: このあとの節の例
        to: このあとのセクションの例

  # ソフトウェアの「版」はバージョンと書く（2026-11-08 利用者の指示）。
  # 置き換えると意味が壊れる語は当てない:
  #   前に付く語: 初版・出版・絶版・再版・改版・重版・図版・製版・活版
  #   後に付く語: 版画・版元・版権・版下・版図
  #   言語・形式の版（英語版・日本語版・Markdown 版）は「バージョン」ではなく版本の意味なので当てない。
  - expected: バージョン
    pattern: /(?<![初出絶再改重図製活語]|[A-Za-z] ?)版(?![画元権下図])/
    specs:
      - from: Kotlin の版を確かめる
        to: Kotlin のバージョンを確かめる
      - from: 以前の版で作ったディレクトリ
        to: 以前のバージョンで作ったディレクトリ
      - from: 版なしのまま
        to: バージョンなしのまま
      - from: 初版から変わらない
        to: 初版から変わらない
      - from: 出版された本
        to: 出版された本
      - from: 取得されるのは英語版です
        to: 取得されるのは英語版です
      - from: Markdown 版を開きます
        to: Markdown 版を開きます

  # 「Kotlin 圏」「Java 圏」の「圏」は、ライブラリ・ツールのことか、使う人のことか、プロジェクトのことかを言わない（2026-11-08 利用者の指示）。
  # 検出だけ（言い換えは文脈で変わる。「Kotlin のエコシステム内」「Kotlin を使うプロジェクト」など）。言い換え方は AGENTS.md の「文章の方針」。
  # expected は案の1つ（自動修正はしない。文脈に合わせて直す）。
  # 地名や決まった語は当てない:
  #   前に付く語: 首都圏・都市圏・北極圏・南極圏・大気圏・成層圏・商圏
  #   後に付く語: 圏外・圏論
  - expected: のエコシステム内
    pattern: /(?<!首都|都市|[北南]極|大気|成層|商)圏(?![外論])/
    prh: 「〜圏」は使わない。「Kotlin のエコシステム内」「Kotlin を使うプロジェクト」など、何を指すかを文脈に合わせて書く
    specs:
      - from: Kotlin 圏で広く使われる
        to: Kotlin のエコシステム内で広く使われる
      - from: 首都圏のオフィス
        to: 首都圏のオフィス
      - from: 北極圏の気候
        to: 北極圏の気候
      - from: 電波が圏外になる
        to: 電波が圏外になる
      - from: 圏論の用語
        to: 圏論の用語
