name: IDE plugin nightly

# The property-based tests of katachi-intellij-plugin (`uiTest`), run with 20 times the sequences
# of the pull request run (ci.yml, job ide-plugin) and a seed of their own each night.
#
# The pull request run keeps a fixed seed and few sequences so that it stays short and repeatable.
# Some states take a few hundred sequences to reach (before the generator mixed in the runs of
# Scenarios.kt, a regression that kept a result over a list that had lost every template first
# showed on the 380th), so this run explores further, and somewhere else each night. A red run
# prints the shrunk catalog and operations; the job summary has the command that plays the same
# seed again.
#
# The job smoke-261 runs the Driver smokes of the gutter, the architecture module name and the definition
# authoring on a real IDEA 2026.1, and the job smoke-263 runs the no-role notification's and the definition
# authoring's Driver smokes on a real IDEA 2026.3 (see the jobs).
#
# macOS for the same reason as ci.yml: the renders the properties draw run on the same Skia and
# fonts as the verifyPreview goldens, and the plugin is only checked there.

on:
  schedule:
    # 19:00 UTC = 04:00 JST.
    - cron: '0 19 * * *'
  workflow_dispatch:
    inputs:
      seed:
        description: 'Seed of the property-based tests (empty: the run id)'
        required: false
        default: ''
      scale:
        description: 'How many times the default number of sequences to run'
        required: false
        default: '20'

concurrency:
  group: ide-plugin-nightly
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  pbt:
    name: pbt (scale ${{ inputs.scale || '20' }})
    runs-on: macos-26
    # Scale 20 took about 33 minutes on an Apple silicon laptop (1965 s in the v0.2.0 prerelease;
    # the pull request run's properties take under a minute); the limit leaves room for a slower
    # runner and a cold SDK download.
    timeout-minutes: 90
    env:
      PBT_SEED: ${{ inputs.seed || github.run_id }}
      PBT_SCALE: ${{ inputs.scale || '20' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Cache .intellijPlatform
        uses: actions/cache@v5
        with:
          path: katachi-intellij-plugin/.intellijPlatform
          key: intellij-platform-${{ runner.os }}-${{ hashFiles('katachi-intellij-plugin/gradle/libs.versions.toml', 'katachi-intellij-plugin/settings.gradle.kts') }}
          restore-keys: |
            intellij-platform-${{ runner.os }}-

      # Written first, so that a red run has it too.
      - name: Record the seed
        run: |
          {
            echo "### Property-based tests"
            echo ""
            echo "seed \`${PBT_SEED}\`, scale \`${PBT_SCALE}\`. To play the same sequences again:"
            echo ""
            echo "\`\`\`"
            echo "cd katachi-intellij-plugin && ./gradlew uiTest -Pkatachi.pbt.seed=${PBT_SEED} -Pkatachi.pbt.scale=${PBT_SCALE}"
            echo "\`\`\`"
          } >> "${GITHUB_STEP_SUMMARY}"

      # Straight through the plugin's own wrapper: only uiTest, without the root build around it.
      - name: Run uiTest
        working-directory: katachi-intellij-plugin
        run: >
          ./gradlew uiTest
          "-Pkatachi.pbt.seed=${PBT_SEED}"
          "-Pkatachi.pbt.scale=${PBT_SCALE}"
          --console=plain
          --stacktrace

      - name: Upload reports
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: ide-plugin-pbt-reports
          path: |
            katachi-intellij-plugin/build/reports/
            katachi-intellij-plugin/build/test-results/
            katachi-intellij-plugin/build/uiTest-failures/
          retention-days: 14
          if-no-files-found: ignore

  # Binary compatibility of the plugin with IDEA (recommended builds) and Android Studio, which
  # `sinceBuild = "261"` with no upper bound promises (known false reports on 263 are held back by verifyPlugin-ignored-problems.txt). It downloads several IDEs (about 3 GB), so it
  # is here and not in ci.yml.
  verify-plugin:
    name: verifyPlugin (IDEA and Android Studio)
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Cache .intellijPlatform
        uses: actions/cache@v5
        with:
          path: katachi-intellij-plugin/.intellijPlatform
          key: intellij-platform-${{ runner.os }}-${{ hashFiles('katachi-intellij-plugin/gradle/libs.versions.toml', 'katachi-intellij-plugin/settings.gradle.kts') }}
          restore-keys: |
            intellij-platform-${{ runner.os }}-

      - name: Run verifyPlugin
        working-directory: katachi-intellij-plugin
        run: ./gradlew verifyPlugin --console=plain --stacktrace

      - name: Summarize the report
        if: ${{ always() }}
        working-directory: katachi-intellij-plugin
        run: |
          {
            echo "### verifyPlugin"
            echo ""
            for dir in build/reports/pluginVerifier/*/; do
              echo "- \`$(basename "${dir}")\`: $(ls "${dir}plugins" 2>/dev/null | tr '\n' ' ')"
            done
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload reports
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: ide-plugin-verify-reports
          path: katachi-intellij-plugin/build/reports/pluginVerifier/
          retention-days: 14
          if-no-files-found: ignore

  # The Driver smokes on a real IDEA 2026.1 (261, the build the plugin is compiled against): the gutter's surfaces and actions, the
  # architecture module name (ide-quality), and the definition authoring (ide-authoring). Each opens a real IDE (macOS runners have
  # a desktop session) and reads the plugin's debug bridge from inside it.
  #
  # One job per smoke: each IDE indexes the whole repository the sample includes (about 420 000 files, some 15 minutes on these
  # runners) before the smoke starts, so four of them one after the other do not fit in one job.
  smoke-261:
    name: integrationTest ${{ matrix.smoke }} (IDEA 2026.1)
    runs-on: macos-26
    # The IDE's index of the copy (SMOKE_INDEXING_TIMEOUT waits up to 40 minutes), the smoke, a cold IDE download and the build.
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        smoke:
          - GutterSurfacesSmokeTest
          - GutterActionsSmokeTest
          - ArchModuleNameSmokeTest
          - DefinitionAuthoringSmokeTest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17 and 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: |
            17
            21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Cache .intellijPlatform
        uses: actions/cache@v5
        with:
          path: katachi-intellij-plugin/.intellijPlatform
          key: intellij-platform-${{ runner.os }}-${{ hashFiles('katachi-intellij-plugin/gradle/libs.versions.toml', 'katachi-intellij-plugin/settings.gradle.kts') }}
          restore-keys: |
            intellij-platform-${{ runner.os }}-

      # The smokes run `git add` and commit in their copy of the repository.
      - name: Configure git
        run: |
          git config --global user.email "ci@example.invalid"
          git config --global user.name "katachi CI"

      - name: Run integrationTest
        working-directory: katachi-intellij-plugin
        run: >
          ./gradlew integrationTest
          --tests '*${{ matrix.smoke }}*'
          --console=plain
          --stacktrace

      - name: Upload reports
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: ide-plugin-smoke-261-${{ matrix.smoke }}-reports
          path: |
            katachi-intellij-plugin/build/reports/
            katachi-intellij-plugin/build/test-results/
            katachi-intellij-plugin/build/integrationTest/**/log/
            katachi-intellij-plugin/build/integrationTest/**/screenshots/
          retention-days: 14
          if-no-files-found: ignore

  # The no-role notification's smoke and the definition authoring's on a real IDEA 2026.3 (263), where the VCS API
  # (ChangeListManager, ProjectLevelVcsManager) moved into the bundled "Version Control" plugin. verifyPlugin reports those classes
  # unresolved there (verifyPlugin-ignored-problems.txt), so this run is what shows the plugin still sees them: the no-role smoke's
  # untracked → `git add` wording calls them. It opens a real IDE (macOS runners have a desktop session) and drives it from inside
  # the IDE, without real mouse or key events. One job per smoke, for the same reason as smoke-261.
  smoke-263:
    name: integrationTest263 ${{ matrix.smoke }} (IDEA 2026.3)
    runs-on: macos-26
    # The IDE's index of the copy (up to 40 minutes), the smoke, the 263 download and the build.
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        smoke:
          - NoRoleSmokeTest
          - DefinitionAuthoringSmokeTest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17 and 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: |
            17
            21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Cache .intellijPlatform
        uses: actions/cache@v5
        with:
          path: katachi-intellij-plugin/.intellijPlatform
          key: intellij-platform-${{ runner.os }}-${{ hashFiles('katachi-intellij-plugin/gradle/libs.versions.toml', 'katachi-intellij-plugin/settings.gradle.kts') }}
          restore-keys: |
            intellij-platform-${{ runner.os }}-

      # The smokes run `git add` in their copy of the repository.
      - name: Configure git
        run: |
          git config --global user.email "ci@example.invalid"
          git config --global user.name "katachi CI"

      - name: Run integrationTest263
        working-directory: katachi-intellij-plugin
        run: >
          ./gradlew integrationTest263
          --tests '*${{ matrix.smoke }}*'
          --console=plain
          --stacktrace

      - name: Upload reports
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: ide-plugin-smoke-263-${{ matrix.smoke }}-reports
          path: |
            katachi-intellij-plugin/build/reports/
            katachi-intellij-plugin/build/test-results/
            katachi-intellij-plugin/build/integrationTest263/**/log/
          retention-days: 14
          if-no-files-found: ignore
