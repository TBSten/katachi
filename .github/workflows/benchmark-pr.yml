name: Benchmark (PR)

# On-demand comparison of a pull request against its base, when the PR carries the `perf`
# label (research table No.11). Both sides are measured on the same runner, base first and head
# right after, so the runner's own speed cancels out and the ratio is what the PR changed. The
# table goes to the job summary; nothing fails on a regression, since one pair of runs is not
# enough to fail a PR on.
#
# Runs when the label is added, and again on every push while it stays. Remove the label to
# stop. The label has to exist in the repository (Issues > Labels > New label: `perf`).
#
# `pull_request` rather than `pull_request_target`: the head's code is built and run here, so
# it must not get a write token or secrets, and it needs neither -- the summary is all it writes.

on:
  pull_request:
    types: [ labeled, synchronize ]

# A push while a comparison runs cancels it: only the newest head is worth comparing. Runs that
# will skip the job (another label added, a push to a PR without `perf`) get a group of their
# own, so that they never cancel a comparison in progress.
concurrency:
  group: >-
    ${{ github.workflow }}-${{ github.event.pull_request.number }}-${{
    ((github.event.action == 'labeled' && github.event.label.name == 'perf') ||
    (github.event.action == 'synchronize' && contains(github.event.pull_request.labels.*.name, 'perf')))
    && 'perf' || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # A subset, to keep one comparison around half an hour (two full runs would take 40 minutes
  # or more). The walk and the Konsist path are where the time goes; the other benchmarks are
  # covered nightly. Widen it here when a PR touches something else.
  PR_BENCHMARK_INCLUDES: 'WalkBench|KonsistScopeBench'

jobs:
  compare:
    name: compare base and head
    if: >-
      (github.event.action == 'labeled' && github.event.label.name == 'perf') ||
      (github.event.action == 'synchronize' && contains(github.event.pull_request.labels.*.name, 'perf'))
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout head
        uses: actions/checkout@v7
        with:
          path: head

      - name: Checkout base
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: base

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      # A base from before :benchmark existed has nothing to compare with. Say so rather than
      # fail: the head's numbers are still in the artifact.
      - name: Base has the benchmarks
        id: base
        run: |
          if [ -f base/benchmark/build.gradle.kts ]; then
            echo "present=true" >> "${GITHUB_OUTPUT}"
          else
            echo "present=false" >> "${GITHUB_OUTPUT}"
            echo "base (${{ github.event.pull_request.base.sha }}) に :benchmark がないため、比較せず head だけ測ります。" >> "${GITHUB_STEP_SUMMARY}"
          fi

      # Base first, head second, in the same job: the two share the runner.
      - name: JMH on base
        if: ${{ steps.base.outputs.present == 'true' }}
        working-directory: base
        run: ./gradlew :benchmark:jmh "-Pjmh.includes=${PR_BENCHMARK_INCLUDES}" --stacktrace

      - name: JMH on head
        working-directory: head
        run: ./gradlew :benchmark:jmh "-Pjmh.includes=${PR_BENCHMARK_INCLUDES}" --stacktrace

      - name: Compare
        if: ${{ steps.base.outputs.present == 'true' }}
        run: >
          python3 head/.github/scripts/jmh-compare.py
          base/benchmark/build/results/jmh/results.json
          head/benchmark/build/results/jmh/results.json
          --time-threshold 1.5
          --alloc-threshold 1.2
          >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload results
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: jmh-pr-results
          path: |
            base/benchmark/build/results/jmh/
            head/benchmark/build/results/jmh/
          retention-days: 14
          if-no-files-found: ignore
