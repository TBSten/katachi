name: Publish

on:
  release:
    types: [ published ]
  workflow_dispatch:

concurrency:
  group: publish
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    name: publish
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Tag matches the version in the catalog
        if: ${{ github.event_name == 'release' }}
        run: |
          catalog=$(sed -n 's/^katachi = "\(.*\)"/\1/p' gradle/libs.versions.toml | head -n 1)
          tag="${GITHUB_REF_NAME#v}"
          echo "catalog=$catalog  tag=$tag"
          if [ "$catalog" != "$tag" ]; then
            echo "::error::gradle/libs.versions.toml は $catalog、tag は $tag。揃えてから publish してください。"
            exit 1
          fi

      - name: Version is not a SNAPSHOT
        run: |
          catalog=$(sed -n 's/^katachi = "\(.*\)"/\1/p' gradle/libs.versions.toml | head -n 1)
          case "$catalog" in
            *-SNAPSHOT)
              echo "::error::$catalog は SNAPSHOT です。リリース版に上げてください。"
              exit 1
              ;;
          esac

      - name: Check
        run: ./gradlew :katachi:check :katachi-konsist:check :katachi-konture:check :katachi-script:check :katachi-gradle-plugin:check --stacktrace

      - name: Publish to Maven Central
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_IN_MEMORY_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyId: ${{ secrets.SIGNING_IN_MEMORY_KEY_ID }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_IN_MEMORY_KEY_PASSWORD }}
        run: ./gradlew publishAndReleaseToMavenCentral --no-configuration-cache --stacktrace

      - name: Upload reports
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: publish-reports
          path: |
            **/build/reports/
            **/build/test-results/
          retention-days: 7
          if-no-files-found: ignore

  # The IDE plugin (experimental) is not on JetBrains Marketplace: its zip is attached to the GitHub
  # Release instead, and users install it from disk. No `needs`: it runs, and can be re-run, apart
  # from Maven Central. macOS as ci.yml's ide-plugin job, the only place buildPlugin runs in CI; only
  # The `katachi` command for Homebrew: katachi-cli-<version>.tar.gz (katachi.main.kts, bin/katachi,
  # katachi-install.sh) attached to the release, and the formula in TBSten/homebrew-tap pointed at
  # it. The script inside resolves me.tbsten.katachi:katachi-script from Maven Central at first
  # run, so this waits for `publish`; the formula still only installs once Central has synced.
  #
  # Pushing to the tap needs HOMEBREW_TAP_TOKEN, a fine-grained token with Contents: read and
  # write on TBSten/homebrew-tap. Without it the tarball is still attached and the formula is left
  # for a hand edit (the step prints the url and sha256 to paste).
  cli-tarball:
    name: attach the CLI tarball and update the tap
    if: ${{ github.event_name == 'release' }}
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build the tarball
        run: ./gradlew :katachi-script:cliTar --console=plain --stacktrace

      - name: Attach it to the release
        id: tarball
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(sed -n 's/^katachi = "\(.*\)"/\1/p' gradle/libs.versions.toml | head -n 1)
          tarball="katachi-script/build/distributions/katachi-cli-${version}.tar.gz"
          if [ -z "${version}" ] || [ ! -f "${tarball}" ]; then
            echo "::error::${tarball} がありません。gradle/libs.versions.toml の katachi と katachi-script/build.gradle.kts の cliTar を確かめてください。"
            exit 1
          fi
          gh release upload "${GITHUB_REF_NAME}" "${tarball}" --clobber
          sha=$(sha256sum "${tarball}" | cut -d ' ' -f 1)
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "sha256=${sha}" >> "${GITHUB_OUTPUT}"
          echo "url=https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/katachi-cli-${version}.tar.gz" >> "${GITHUB_OUTPUT}"

      - name: Update the formula in the tap
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          URL: ${{ steps.tarball.outputs.url }}
          SHA256: ${{ steps.tarball.outputs.sha256 }}
          VERSION: ${{ steps.tarball.outputs.version }}
        run: |
          if [ -z "${TAP_TOKEN}" ]; then
            echo "::warning::HOMEBREW_TAP_TOKEN が無いので tap は更新していません。Formula/katachi.rb に手で入れてください: url \"${URL}\" / sha256 \"${SHA256}\""
            exit 0
          fi
          git clone --depth 1 "https://x-access-token:${TAP_TOKEN}@github.com/TBSten/homebrew-tap.git" tap
          formula=tap/Formula/katachi.rb
          sed -i -e "s|^  url \".*\"$|  url \"${URL}\"|" -e "s|^  sha256 \".*\"$|  sha256 \"${SHA256}\"|" "${formula}"
          grep -q "${SHA256}" "${formula}" || { echo "::error::${formula} を書き換えられませんでした"; exit 1; }
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/katachi.rb
          git commit -m "katachi ${VERSION}"
          git push origin HEAD

  # buildPlugin, as the tests ran on the pull requests.
  # The plugin has a version of its own (`katachiIntellij` in the root catalog), apart from katachi's.
  # If it fails, attach the zip by hand:
  #   cd katachi-intellij-plugin && ./gradlew buildPlugin
  #   gh release upload v<katachi version> build/distributions/katachi-intellij-plugin-<plugin version>.zip --clobber
  ide-plugin-zip:
    name: attach the IDE plugin zip
    if: ${{ github.event_name == 'release' }}
    runs-on: macos-26
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Cache .intellijPlatform
        uses: actions/cache@v5
        with:
          path: katachi-intellij-plugin/.intellijPlatform
          key: intellij-platform-${{ runner.os }}-${{ hashFiles('katachi-intellij-plugin/gradle/libs.versions.toml', 'katachi-intellij-plugin/settings.gradle.kts') }}
          restore-keys: |
            intellij-platform-${{ runner.os }}-

      - name: Build the plugin zip
        working-directory: katachi-intellij-plugin
        run: ./gradlew buildPlugin verifyPluginStructure --console=plain --stacktrace

      # The zip is named after the plugin's own version, `katachiIntellij` in the root catalog (not
      # the tag, which carries katachi's version): a missing file means build.gradle.kts stopped
      # reading it.
      - name: Attach it to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(sed -n 's/^katachiIntellij = "\(.*\)"/\1/p' gradle/libs.versions.toml | head -n 1)
          zip="katachi-intellij-plugin/build/distributions/katachi-intellij-plugin-${version}.zip"
          if [ -z "${version}" ] || [ ! -f "${zip}" ]; then
            echo "::error::${zip} がありません。gradle/libs.versions.toml の katachiIntellij と build.gradle.kts の version を確かめてください。"
            exit 1
          fi
          gh release upload "${GITHUB_REF_NAME}" "${zip}" --clobber
