name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  # One in-flight run per pull request, and one per branch otherwise. Runs on
  # main are not cancelled: commits land there directly, so each one has to be
  # verified on its own.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      # setup-gradle validates every gradle-wrapper.jar in the repository
      # (`validate-wrappers` defaults to true), which covers the wrappers of
      # every sample under sample/ as well, so a separate
      # gradle/actions/wrapper-validation step would be redundant.
      #
      # Gradle's dependency cache is reused between runs. To reuse the
      # configuration cache too, add a repository secret and pass it as
      # `cache-encryption-key`.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      # Insurance against the AGP built-in Kotlin problem: AGP ships its own
      # Kotlin Gradle Plugin, and if a sample ever compiles with that one instead
      # of the version katachi is built with, its tests fail with "Module was
      # compiled with an incompatible version of Kotlin". The script compares
      # what each sample actually resolves with the root catalog.
      - name: Kotlin versions agree across the samples
        run: .github/scripts/check-kotlin-versions.sh

      # Its own step, ahead of the root `check` that also covers it. The GradleTestKit
      # functional tests download every Gradle distribution of the compatibility matrix
      # (8.0 and 9.6.0), which makes them the slowest and the only network-bound part of
      # the check. Naming them here means a red run points at the plugin instead of at
      # `./gradlew check`; the root check below then finds the work already done.
      - name: Check katachi-gradle-plugin
        run: ./gradlew :katachi-gradle-plugin:check --stacktrace

      # The Dokka plugin behind the API reference (Featured sections, llms.txt). Named for
      # the same reason: its tests run Dokka itself, several times over, and a red run should
      # point at the plugin. The root check below covers it again and finds the work done.
      - name: Check tool/dokka
        run: ./gradlew :tool:dokka:check --stacktrace

      # The same plugin wired into the real build: the modules' runs and the aggregating run
      # of the API reference, then verifyApiDocs over what they wrote (Featured sections, the
      # llms files and their links). The Docs workflow runs this too, but only on main; here a
      # pull request that breaks the wiring goes red before it lands. Nothing is deployed.
      - name: Generate and verify the API reference
        run: ./gradlew generateApiDocs --stacktrace

      - name: Check katachi
        run: ./gradlew check --stacktrace

      # sample/* are standalone Gradle builds; each checkSample* task shells out
      # to that sample's own wrapper (see the root build.gradle.kts for why).
      # One step per sample, so a red run says immediately which one broke.
      #
      # ubuntu-latest ships the Android SDK at ANDROID_HOME
      # (/usr/local/lib/android/sdk) with the platforms sample/android and
      # sample/kmp ask for, so no android-actions/setup-android step is needed
      # and no local.properties has to be written.
      - name: Check sample/jvm
        run: ./gradlew checkSampleJvm --stacktrace

      - name: Check sample/android
        run: ./gradlew checkSampleAndroid --stacktrace

      # Runs :architecture-test:test and :app:android:testDebugUnitTest, not
      # `check`: the KMP modules declare Apple targets that a Linux runner cannot
      # build. The first task is the katachi verification (it lives in a module of
      # its own), the second proves the sample still compiles as a KMP project.
      - name: Check sample/kmp
        run: ./gradlew checkSampleKmp --stacktrace

      # The processor sample. Its `katachi<Key>` tasks are the only place in CI where a
      # user-written processor is resolved out of the generated registry and run -- three of
      # them, one of which answers `Result.failure` and therefore decides its task's exit status.
      - name: Check sample/custom-processor
        run: ./gradlew checkSampleCustomProcessor --stacktrace

      - name: Upload reports
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: reports
          path: |
            **/build/reports/
            **/build/test-results/
          retention-days: 7
          if-no-files-found: ignore

  # The documentation site, built the way docs.yml builds it for GitHub Pages, but on every push
  # and pull request and without deploying. `astro build` checks every internal link
  # (starlight-links-validator), including the links into the API reference, so the reference is
  # generated first. A pull request that breaks a page, a link or the API reference goes red here
  # instead of in the deploy after it lands.
  docs:
    name: docs
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Generate API reference
        run: ./gradlew generateApiDocs --stacktrace

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          package_json_file: docs/package.json

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: docs/pnpm-lock.yaml

      - name: Install docs dependencies
        working-directory: docs
        run: pnpm install --frozen-lockfile

      - name: Build docs
        working-directory: docs
        run: pnpm run build

  # katachi-intellij-plugin is a standalone Gradle build (see its settings.gradle.kts), so the
  # root `check` above never reaches it. checkIdePlugin runs `buildPlugin test verifyPreview`
  # through the plugin's own wrapper; `test` runs `uiTest` (the property-based and Compose UI
  # tests) as well.
  #
  # macOS, not ubuntu: the verifyPreview goldens under katachi-intellij-plugin/snapshots/preview
  # were rendered on macOS (Skia with the system's fonts and text shaping), and a Linux render does
  # not match them byte for byte. The label is pinned to the macOS the goldens were made on; bump it
  # together with an `updatePreview` run on the new version.
  #
  # `integrationTest` is not run here: it starts a real IDE through Starter and drives its windows,
  # which needs a display session and minutes of IDE start-up per run, and it opens sample/jvm
  # through a full Gradle import. It stays a check to run by hand before a release.
  ide-plugin:
    name: ide-plugin
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # The root build (which only configures here) runs on 17 like the job above; the plugin's
      # `jvmToolchain(21)` needs a 21, the JBR version the 261 platform runs on. The last one listed
      # becomes JAVA_HOME, which the plugin's wrapper inherits from the Exec task.
      - name: Set up JDK 17 and 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: |
            17
            21

      # Caches ~/.gradle, which holds the IntelliJ Platform SDK the plugin compiles against once it
      # has been downloaded (a whole IDE distribution, the slow part of a cold run).
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      # What the IntelliJ Platform Gradle Plugin keeps next to the build: the extracted platform
      # layout and the product release list it resolves the SDK with.
      - name: Cache .intellijPlatform
        uses: actions/cache@v5
        with:
          path: katachi-intellij-plugin/.intellijPlatform
          key: intellij-platform-${{ runner.os }}-${{ hashFiles('katachi-intellij-plugin/gradle/libs.versions.toml', 'katachi-intellij-plugin/settings.gradle.kts') }}
          restore-keys: |
            intellij-platform-${{ runner.os }}-

      - name: Check katachi-intellij-plugin
        run: ./gradlew checkIdePlugin --stacktrace

      # The test reports, the shrunk counterexample and its PNG of a failing property
      # (build/uiTest-failures), and every PNG verifyPreview rendered (build/preview): a failing
      # gate (e.g. "text is cut") stops before the before/after report is written, and the PNGs
      # this runner drew are what tells a font difference from a real overflow.
      - name: Upload reports
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: ide-plugin-reports
          path: |
            katachi-intellij-plugin/build/reports/
            katachi-intellij-plugin/build/test-results/
            katachi-intellij-plugin/build/uiTest-failures/
            katachi-intellij-plugin/build/preview/
          retention-days: 7
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------------------------
  # Benchmarks, on the same triggers as the checks above (every push to main and every pull
  # request). Two measuring jobs and one storing job:
  #
  #   bench-jmh           the JMH benchmarks of :benchmark (time and allocation per operation)
  #   bench-real-project  validate() on a pinned commit of a public project (android/nowinandroid)
  #   bench-store         main only: adds both results to the history on gh-pages
  #
  # The measuring jobs build and run the checked-out code, so they get a read-only token like the
  # checks above. On a pull request they compare against the history on gh-pages and write the
  # table to the job summary; nothing is stored and nothing fails on a regression (the standard
  # runners wobble by 10-20% between runs). Only bench-store, which runs no code of the checkout
  # beyond one script, gets write access, and only on main.
  #
  # The thresholds are where the research started (time 150%, allocation 120%). Revisit them once
  # a couple of weeks of history has piled up: the larger of "median + 4 x MAD" and
  # "median x 1.5" of that history is the rule the research suggests. benchmark-pr.yml (label
  # `perf`) measures a pull request against its base on one runner, when a closer comparison is
  # wanted.
  #
  # The gh-pages branch
  # -------------------
  # github-action-benchmark keeps its data (dev/bench/data.js) and a chart page on `gh-pages`.
  # Create the branch once, empty, before the first run on main:
  #
  #   git checkout --orphan gh-pages && git rm -rf . && git commit --allow-empty -m "gh-pages" \
  #     && git push origin gh-pages
  #
  # The branch only holds data: the site is deployed by docs.yml ("GitHub Actions" as the Pages
  # source), so the chart page there is not served.
  bench-jmh:
    name: bench-jmh
    runs-on: ubuntu-latest
    # The full suite: about 24 parameter sets x 2 forks x (3 + 5) x 2 s, plus AssertColdBench's
    # 5 cold forks each. Roughly 15-20 minutes; the limit leaves room for a slow runner.
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      # Always the whole suite: a partial run would be stored as a point of history too, with
      # most of the series missing from it. Narrow runs belong on a machine of your own
      # (`-Pjmh.includes=<regex>`, see benchmark/build.gradle.kts). Fork / warmup / measurement
      # come from each benchmark's annotations, not from here.
      - name: Run JMH
        run: ./gradlew :benchmark:jmh --stacktrace

      # github-action-benchmark's `jmh` tool reads only the primary metric (time). The
      # allocation per operation is lifted out into a series of its own, so it can carry a
      # tighter threshold than time.
      - name: Extract allocation per operation
        run: >
          .github/scripts/jmh-alloc-to-custom.py
          benchmark/build/results/jmh/results.json
          benchmark/build/results/jmh/alloc.json

      # A comparison, never a gate: it must not turn the pull request red, also when gh-pages
      # has no history yet.
      - name: Compare time with main
        if: ${{ github.event_name == 'pull_request' }}
        continue-on-error: true
        uses: benchmark-action/github-action-benchmark@v1
        with:
          name: JMH time
          tool: jmh
          output-file-path: benchmark/build/results/jmh/results.json
          github-token: ${{ secrets.GITHUB_TOKEN }}
          gh-pages-branch: gh-pages
          benchmark-data-dir-path: dev/bench
          auto-push: false
          save-data-file: false
          alert-threshold: '150%'
          comment-on-alert: false
          fail-on-alert: false
          summary-always: true

      # A comparison, never a gate: it must not turn the pull request red, also when gh-pages
      # has no history yet.
      - name: Compare allocation per operation with main
        if: ${{ github.event_name == 'pull_request' }}
        continue-on-error: true
        uses: benchmark-action/github-action-benchmark@v1
        with:
          name: JMH alloc/op
          tool: customSmallerIsBetter
          output-file-path: benchmark/build/results/jmh/alloc.json
          github-token: ${{ secrets.GITHUB_TOKEN }}
          gh-pages-branch: gh-pages
          benchmark-data-dir-path: dev/bench
          auto-push: false
          save-data-file: false
          alert-threshold: '120%'
          comment-on-alert: false
          fail-on-alert: false
          summary-always: true

      # bench-store reads the results from here.
      - name: Upload results
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: jmh-results
          path: benchmark/build/results/jmh/
          retention-days: 30
          if-no-files-found: ignore

  # validate() on a real, public project at a pinned commit (research table No.15). Synthetic
  # trees miss what real ones have: deep directories, uneven modules, real Kotlin to parse.
  #
  # katachi is not added to the project's build. The runner in :benchmark (source set
  # `realProject`) reads the checkout as a plain directory, with a coarse definition kept in
  # this repository, so the project's own Gradle, AGP and Kotlin versions never meet katachi's.
  # Violations are expected (the definition is coarse) and do not fail the job.
  bench-real-project:
    name: bench-real-project (nowinandroid)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Bump deliberately, together with the definition in
      # benchmark/src/realProject/kotlin/.../NowInAndroidArchitecture.kt. A new commit changes
      # the tree being measured, so expect one step in the chart when it moves.
      REAL_PROJECT_REPOSITORY: https://github.com/android/nowinandroid.git
      REAL_PROJECT_COMMIT: a49ed253d75e61a2b6ab80a8da677b57437b08eb
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # A shallow fetch of the one pinned commit. A git repository, not an export: the
      # definition uses `files = gitTracked()`, as a real project would.
      - name: Check out nowinandroid
        run: |
          dir="${RUNNER_TEMP}/nowinandroid"
          git init -q "${dir}"
          git -C "${dir}" remote add origin "${REAL_PROJECT_REPOSITORY}"
          git -C "${dir}" fetch -q --depth 1 origin "${REAL_PROJECT_COMMIT}"
          git -C "${dir}" checkout -q FETCH_HEAD
          echo "files: $(git -C "${dir}" ls-files | wc -l)"

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Measure validate()
        run: >
          ./gradlew :benchmark:measureRealProject
          -PrealProject.name=nowinandroid
          "-PrealProject.dir=${RUNNER_TEMP}/nowinandroid"
          -PrealProject.warmups=5
          -PrealProject.iterations=15
          --stacktrace

      # A comparison, never a gate: it must not turn the pull request red, also when gh-pages
      # has no history yet.
      - name: Compare with main
        if: ${{ github.event_name == 'pull_request' }}
        continue-on-error: true
        uses: benchmark-action/github-action-benchmark@v1
        with:
          name: Real project (nowinandroid)
          tool: customSmallerIsBetter
          output-file-path: benchmark/build/results/real-project/nowinandroid.json
          github-token: ${{ secrets.GITHUB_TOKEN }}
          gh-pages-branch: gh-pages
          benchmark-data-dir-path: dev/bench
          auto-push: false
          save-data-file: false
          alert-threshold: '150%'
          comment-on-alert: false
          fail-on-alert: false
          summary-always: true

      - name: Upload results
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: real-project-results
          path: benchmark/build/results/real-project/
          retention-days: 30
          if-no-files-found: ignore

  bench-store:
    name: bench-store
    needs: [ bench-jmh, bench-real-project ]
    # Main only. Also when one of the two failed: they measure different things, and whatever
    # was measured is stored. Not when the run was cancelled.
    if: ${{ github.event_name == 'push' && !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      # Push to gh-pages and post the commit comment on an alert.
      contents: write
    # One at a time across runs: each store pushes to gh-pages, and two pushes to main in quick
    # succession would otherwise race on that branch. Queued, never cancelled: every commit on
    # main is a point of history.
    concurrency:
      group: bench-store
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download JMH results
        uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          name: jmh-results
          path: benchmark/build/results/jmh/

      - name: Download real-project results
        uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          name: real-project-results
          path: benchmark/build/results/real-project/

      - name: Store time
        if: ${{ hashFiles('benchmark/build/results/jmh/results.json') != '' }}
        uses: benchmark-action/github-action-benchmark@v1
        with:
          name: JMH time
          tool: jmh
          output-file-path: benchmark/build/results/jmh/results.json
          github-token: ${{ secrets.GITHUB_TOKEN }}
          auto-push: true
          gh-pages-branch: gh-pages
          benchmark-data-dir-path: dev/bench
          alert-threshold: '150%'
          comment-on-alert: true
          fail-on-alert: false
          summary-always: true

      - name: Store allocation per operation
        if: ${{ hashFiles('benchmark/build/results/jmh/alloc.json') != '' }}
        uses: benchmark-action/github-action-benchmark@v1
        with:
          name: JMH alloc/op
          tool: customSmallerIsBetter
          output-file-path: benchmark/build/results/jmh/alloc.json
          github-token: ${{ secrets.GITHUB_TOKEN }}
          auto-push: true
          gh-pages-branch: gh-pages
          benchmark-data-dir-path: dev/bench
          alert-threshold: '120%'
          comment-on-alert: true
          fail-on-alert: false
          summary-always: true

      - name: Store real-project results
        if: ${{ hashFiles('benchmark/build/results/real-project/nowinandroid.json') != '' }}
        uses: benchmark-action/github-action-benchmark@v1
        with:
          name: Real project (nowinandroid)
          tool: customSmallerIsBetter
          output-file-path: benchmark/build/results/real-project/nowinandroid.json
          github-token: ${{ secrets.GITHUB_TOKEN }}
          auto-push: true
          gh-pages-branch: gh-pages
          benchmark-data-dir-path: dev/bench
          alert-threshold: '150%'
          comment-on-alert: true
          fail-on-alert: false
          summary-always: true
