name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  # One in-flight run per pull request, and one per branch otherwise. Runs on
  # main are not cancelled: commits land there directly, so each one has to be
  # verified on its own.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      # setup-gradle validates every gradle-wrapper.jar in the repository
      # (`validate-wrappers` defaults to true), which covers the wrappers of
      # every sample under sample/ as well, so a separate
      # gradle/actions/wrapper-validation step would be redundant.
      #
      # Gradle's dependency cache is reused between runs. To reuse the
      # configuration cache too, add a repository secret and pass it as
      # `cache-encryption-key`.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      # Insurance against the AGP built-in Kotlin problem: AGP ships its own
      # Kotlin Gradle Plugin, and if a sample ever compiles with that one instead
      # of the version katachi is built with, its tests fail with "Module was
      # compiled with an incompatible version of Kotlin". The script compares
      # what each sample actually resolves with the root catalog.
      - name: Kotlin versions agree across the samples
        run: .github/scripts/check-kotlin-versions.sh

      # Its own step, ahead of the root `check` that also covers it. The GradleTestKit
      # functional tests download every Gradle distribution of the compatibility matrix
      # (8.0 and 9.6.0), which makes them the slowest and the only network-bound part of
      # the check. Naming them here means a red run points at the plugin instead of at
      # `./gradlew check`; the root check below then finds the work already done.
      - name: Check katachi-gradle-plugin
        run: ./gradlew :katachi-gradle-plugin:check --stacktrace

      # The Dokka plugin behind the API reference (Featured sections, llms.txt). Named for
      # the same reason: its tests run Dokka itself, several times over, and a red run should
      # point at the plugin. The root check below covers it again and finds the work done.
      - name: Check tool/dokka
        run: ./gradlew :tool:dokka:check --stacktrace

      # The same plugin wired into the real build: the modules' runs and the aggregating run
      # of the API reference, then verifyApiDocs over what they wrote (Featured sections, the
      # llms files and their links). The Docs workflow runs this too, but only on main; here a
      # pull request that breaks the wiring goes red before it lands. Nothing is deployed.
      - name: Generate and verify the API reference
        run: ./gradlew generateApiDocs --stacktrace

      - name: Check katachi
        run: ./gradlew check --stacktrace

      # sample/* are standalone Gradle builds; each checkSample* task shells out
      # to that sample's own wrapper (see the root build.gradle.kts for why).
      # One step per sample, so a red run says immediately which one broke.
      #
      # ubuntu-latest ships the Android SDK at ANDROID_HOME
      # (/usr/local/lib/android/sdk) with the platforms sample/android and
      # sample/kmp ask for, so no android-actions/setup-android step is needed
      # and no local.properties has to be written.
      - name: Check sample/jvm
        run: ./gradlew checkSampleJvm --stacktrace

      - name: Check sample/android
        run: ./gradlew checkSampleAndroid --stacktrace

      # Runs :architecture-test:test and :app:android:testDebugUnitTest, not
      # `check`: the KMP modules declare Apple targets that a Linux runner cannot
      # build. The first task is the katachi verification (it lives in a module of
      # its own), the second proves the sample still compiles as a KMP project.
      - name: Check sample/kmp
        run: ./gradlew checkSampleKmp --stacktrace

      # The processor sample. Its `katachi<Key>` tasks are the only place in CI where a
      # user-written processor is resolved out of the generated registry and run -- three of
      # them, one of which answers `Result.failure` and therefore decides its task's exit status.
      - name: Check sample/custom-processor
        run: ./gradlew checkSampleCustomProcessor --stacktrace

      - name: Upload reports
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: reports
          path: |
            **/build/reports/
            **/build/test-results/
          retention-days: 7
          if-no-files-found: ignore

  # katachi-intellij-plugin is a standalone Gradle build (see its settings.gradle.kts), so the
  # root `check` above never reaches it. checkIdePlugin runs `buildPlugin test verifyPreview`
  # through the plugin's own wrapper; `test` runs `uiTest` (the property-based and Compose UI
  # tests) as well.
  #
  # macOS, not ubuntu: the verifyPreview goldens under katachi-intellij-plugin/snapshots/preview
  # were rendered on macOS (Skia with the system's fonts and text shaping), and a Linux render does
  # not match them byte for byte. The label is pinned to the macOS the goldens were made on; bump it
  # together with an `updatePreview` run on the new version.
  #
  # `integrationTest` is not run here: it starts a real IDE through Starter and drives its windows,
  # which needs a display session and minutes of IDE start-up per run, and it opens sample/jvm
  # through a full Gradle import. It stays a check to run by hand before a release.
  ide-plugin:
    name: ide-plugin
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # The root build (which only configures here) runs on 17 like the job above; the plugin's
      # `jvmToolchain(21)` needs a 21, the JBR version the 261 platform runs on. The last one listed
      # becomes JAVA_HOME, which the plugin's wrapper inherits from the Exec task.
      - name: Set up JDK 17 and 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: |
            17
            21

      # Caches ~/.gradle, which holds the IntelliJ Platform SDK the plugin compiles against once it
      # has been downloaded (a whole IDE distribution, the slow part of a cold run).
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      # What the IntelliJ Platform Gradle Plugin keeps next to the build: the extracted platform
      # layout and the product release list it resolves the SDK with.
      - name: Cache .intellijPlatform
        uses: actions/cache@v5
        with:
          path: katachi-intellij-plugin/.intellijPlatform
          key: intellij-platform-${{ runner.os }}-${{ hashFiles('katachi-intellij-plugin/gradle/libs.versions.toml', 'katachi-intellij-plugin/settings.gradle.kts') }}
          restore-keys: |
            intellij-platform-${{ runner.os }}-

      - name: Check katachi-intellij-plugin
        run: ./gradlew checkIdePlugin --stacktrace

      # The test reports, the shrunk counterexample and its PNG of a failing property
      # (build/uiTest-failures), and the before/after report of a failing verifyPreview
      # (build/preview/report).
      - name: Upload reports
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: ide-plugin-reports
          path: |
            katachi-intellij-plugin/build/reports/
            katachi-intellij-plugin/build/test-results/
            katachi-intellij-plugin/build/uiTest-failures/
            katachi-intellij-plugin/build/preview/report/
          retention-days: 7
          if-no-files-found: ignore
