name: Diff report (PR)

# Posts katachi's own architecture diff report (`katachiDiff`, the Markdown flavour) as a comment on
# every pull request: which roles and groups the change lands in, with the heat per role and the
# files per role. Before is the pull request's base and after is its head, compared the way GitHub
# does (`base...head`), so the report matches the "Files changed" tab.
#
# One comment per pull request. A later run on the same pull request removes the comment the
# earlier run left (found by the marker on its first line) and posts a fresh one at the end of
# the timeline, so the newest head's report is always the one a reviewer sees last.
#
# Two jobs, so that the token that writes the comment never meets the build: `report` builds and
# runs the checkout with a read-only token and hands the Markdown over as an artifact; `comment`
# builds nothing, and only downloads that artifact and posts it.
#
# Both jobs are the actions in `diff-report/` and `diff-report-comment/`, which other repositories
# use as `TBSten/katachi/diff-report` and `TBSten/katachi/diff-report-comment`; this workflow is
# their first user, and their usage example.
#
# `pull_request` rather than `pull_request_target`: the latter is blocked by default for public
# repositories from 2026-12-02, and running the head's code with the base's write token is exactly
# what it would mean. The price is a pull request from a fork: its GITHUB_TOKEN is read-only, so
# `comment` is skipped for it and the report stays in the job summary and the artifact.

on:
  pull_request:
    types: [ opened, synchronize, reopened ]

# A push while a report is being made cancels it: only the newest head is worth reporting on.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  report:
    name: katachiDiff base...head
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # The head itself, not the merge commit `pull_request` would check out: `after` is the head.
      # The whole history, because `git diff base...head` needs the merge base and `gh pr view`
      # resolves refs that are not in a shallow clone.
      - name: Checkout head
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      # The same action other repositories use (`TBSten/katachi/diff-report@<version>`),
      # from the head, so that a pull request that changes it is reported on by its own version.
      # It runs katachiDiff with `pr=`, assembles the comment, writes it to the job summary and
      # uploads it and the HTML report as artifacts.
      - name: Make the report
        uses: ./diff-report
        with:
          task: ':architecture-test:katachiDiff'

  comment:
    name: comment on the pull request
    needs: report
    # A fork's GITHUB_TOKEN cannot write comments; the summary and the artifact are its report.
    if: ${{ !github.event.pull_request.head.repo.fork }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    steps:
      # Only the actions, from the head, and nothing is built: the build is what the read-only token
      # in `report` keeps away from this job's write token. The head's own actions are no more
      # trusted than this workflow file, which `pull_request` also takes from the head, and a fork
      # (whose head nobody here vetted) never gets this far.
      - name: Checkout the actions
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          sparse-checkout: |
            diff-report
            diff-report-comment
          persist-credentials: false

      - name: Replace the comment
        uses: ./diff-report-comment
