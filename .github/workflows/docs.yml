name: Docs

# 公開サイトは 2 つのビルドを 1 つの GitHub Pages に合成する（docs/AGENTS.md「ドキュメントの版」）。
#
# | 置き場所            | ビルド元                         | いま書いている版のラベル          |
# |---------------------|----------------------------------|-----------------------------------|
# | /katachi/           | 最新のリリースタグ（v0.3.0 など） | タグから（v0.3）                  |
# | /katachi/dev/       | main                             | 写しの先頭から算出（v0.4-dev）    |
#
# 利用者が最初に着く root は常に最新のリリースの docs で、main の書きかけは /dev/ にだけ出る。
# root が変わるのはタグを打ったとき（か workflow_dispatch で release_ref を指定したとき）だけ。
on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
    paths:
      - 'docs/**'
      - 'katachi/**'
      - 'katachi-konsist/**'
      - 'katachi-konture/**'
      # The Dokka plugin and the build that wires it into generateApiDocs.
      - 'tool/**'
      - 'build.gradle.kts'
      - 'gradle.properties'
      - 'buildSrc/**'
      - 'gradle/libs.versions.toml'
      - '.github/workflows/docs.yml'
  workflow_dispatch:
    inputs:
      release_ref:
        description: 'root（/katachi/）のビルド元。空なら main から辿れる最新の v* タグ'
        required: false
        default: ''

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # root のビルド元（最新のリリースタグ）を決める。tags は push イベントの ref には付いてこないので、
  # main を履歴ごと取って `git describe` で探す。
  resolve:
    name: resolve release
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      ref: ${{ steps.pick.outputs.ref }}
      label: ${{ steps.pick.outputs.label }}
    steps:
      - name: Checkout main with tags
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          fetch-tags: true

      - name: Pick the latest release tag
        id: pick
        env:
          RELEASE_REF: ${{ inputs.release_ref }}
        run: |
          set -eu
          if [ -n "${RELEASE_REF}" ]; then
            ref="${RELEASE_REF}"
          else
            ref="$(git describe --tags --abbrev=0 --match 'v[0-9]*' main)"
          fi
          # ラベルはタグの major.minor（v0.3.1 → v0.3）。タグでない ref ならその名前のまま。
          case "${ref}" in
            v[0-9]*) label="$(printf '%s' "${ref}" | sed -E 's/^(v[0-9]+\.[0-9]+).*$/\1/')" ;;
            *) label="${ref}" ;;
          esac
          echo "ref=${ref}  label=${label}"
          echo "ref=${ref}" >> "$GITHUB_OUTPUT"
          echo "label=${label}" >> "$GITHUB_OUTPUT"

  build:
    name: build ${{ matrix.channel }}
    needs: resolve
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: true
      matrix:
        include:
          # root。リリースタグの docs をそのままビルドし、版の切り替えに /dev/ を足す。
          # 古いタグ（v0.3.0）の docs は下の環境変数を知らないので無視する（ラベルは当時のまま）。
          # /dev/ の選択肢は assemble が後から差し込む（docs/scripts/add-dev-version-option.mjs）。
          - channel: release
            ref: ${{ needs.resolve.outputs.ref }}
            base: /katachi
            version_label: ${{ needs.resolve.outputs.label }}
            dev_base: /katachi/dev
          # 開発版。main を /katachi/dev/ に出す。ラベルは versions.mjs が算出する。
          - channel: dev
            ref: main
            base: /katachi/dev
            version_label: ''
            dev_base: ''
    steps:
      - name: Checkout ${{ matrix.ref }}
        uses: actions/checkout@v7
        with:
          ref: ${{ matrix.ref }}

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      # verifyApiDocs follows generateApiDocs and fails the job when the Featured sections or
      # the llms files are missing from docs/public/api-docs/.
      - name: Generate API reference
        run: ./gradlew generateApiDocs --stacktrace

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          package_json_file: docs/package.json

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: docs/pnpm-lock.yaml

      - name: Install
        working-directory: docs
        run: pnpm install --frozen-lockfile

      - name: Lint text (docs/prh.yml)
        working-directory: docs
        run: pnpm run lint:text

      - name: Build
        working-directory: docs
        env:
          KATACHI_DOCS_BASE: ${{ matrix.base }}
          KATACHI_DOCS_VERSION_LABEL: ${{ matrix.version_label }}
          KATACHI_DOCS_DEV_BASE: ${{ matrix.dev_base }}
        run: pnpm run build

      - name: Upload ${{ matrix.channel }} build
        uses: actions/upload-artifact@v4
        with:
          name: site-${{ matrix.channel }}
          path: docs/dist
          retention-days: 1
          if-no-files-found: error

  assemble:
    name: assemble
    needs: [ resolve, build ]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download release build
        uses: actions/download-artifact@v4
        with:
          name: site-release
          path: site

      - name: Download dev build into /dev/
        uses: actions/download-artifact@v4
        with:
          name: site-dev
          path: site/dev

      # 古いタグ（v0.3.0 以前）の root は、版の切り替えに開発版の選択肢を持たない。合成したあとの HTML に足す。
      # タグ自身が選択肢を持っていれば（v0.4.0 以降）何もしない。root が v0.4.0 以降になったらこの 2 手順は消してよい。
      - name: Checkout the script that adds the dev option
        uses: actions/checkout@v7
        with:
          path: tools
          sparse-checkout: |
            docs/scripts
            docs/src/lib
          sparse-checkout-cone-mode: false

      - name: Add the dev version to the root version switcher
        env:
          RELEASE_LABEL: ${{ needs.resolve.outputs.label }}
        run: node tools/docs/scripts/add-dev-version-option.mjs site --dev-base /katachi/dev --release-label "${RELEASE_LABEL}"

      - name: Show the layout
        run: |
          ls site | head -n 20
          echo "--- dev"
          ls site/dev | head -n 20

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    name: deploy
    needs: assemble
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
