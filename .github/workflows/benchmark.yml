name: Benchmark

# Nightly performance tracking. Two jobs, both notify-only:
#
#   jmh           the JMH benchmarks of :benchmark (time and allocation per operation)
#   real-project  validate() on a pinned commit of a public project (android/nowinandroid)
#
# Every result is stored by github-action-benchmark on the gh-pages branch, compared with the
# previous run there, and a regression beyond the threshold is posted as a commit comment. No
# job fails on a regression (`fail-on-alert: false`): the standard runners wobble by 10-20%
# between runs, so a red nightly would mostly be noise. Pull requests are compared on demand by
# benchmark-pr.yml (label `perf`) instead.
#
# The thresholds are where the research started (time 150%, allocation 120%). Revisit them once
# a couple of weeks of history has piled up: the larger of "median + 4 x MAD" and
# "median x 1.5" of that history is the rule the research suggests.
#
# The gh-pages branch
# -------------------
# github-action-benchmark pushes its data (dev/bench/data.js) and a chart page (dev/bench/
# index.html) to `gh-pages`. Create the branch once, empty, before the first run:
#
#   git checkout --orphan gh-pages && git rm -rf . && git commit --allow-empty -m "gh-pages" \
#     && git push origin gh-pages
#
# Without it, the first push of the action may fail to fetch the branch. The branch only holds
# data here: the repository's GitHub Pages site is deployed from docs.yml ("GitHub Actions" as
# the Pages source), so the chart page on this branch is not served. The alerts and the job
# summaries work regardless; see the report of this change for ways to publish the chart.

on:
  schedule:
    # 18:00 UTC = 03:00 JST, once a day.
    - cron: '0 18 * * *'
  # Always the whole suite: a partial run would be stored as a point of history too, with most
  # of the series missing from it. Narrow runs belong on a machine of your own
  # (`-Pjmh.includes=<regex>`, see benchmark/build.gradle.kts).
  workflow_dispatch:

# One run at a time: both jobs push to gh-pages, and two nightly runs doing so at once would
# race on that branch.
concurrency:
  group: benchmark
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  jmh:
    name: jmh
    runs-on: ubuntu-latest
    # The full suite: about 24 parameter sets x 2 forks x (3 + 5) x 2 s, plus AssertColdBench's
    # 5 cold forks each. Roughly 15-20 minutes; the limit leaves room for a slow runner.
    timeout-minutes: 60
    permissions:
      # Push to gh-pages and post the commit comment on an alert.
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      # Fork / warmup / measurement come from each benchmark's annotations, not from here.
      - name: Run JMH
        run: ./gradlew :benchmark:jmh --stacktrace

      - name: Store time
        uses: benchmark-action/github-action-benchmark@v1
        with:
          name: JMH time
          tool: jmh
          output-file-path: benchmark/build/results/jmh/results.json
          github-token: ${{ secrets.GITHUB_TOKEN }}
          auto-push: true
          gh-pages-branch: gh-pages
          benchmark-data-dir-path: dev/bench
          alert-threshold: '150%'
          comment-on-alert: true
          fail-on-alert: false
          summary-always: true

      # github-action-benchmark's `jmh` tool reads only the primary metric (time). The
      # allocation per operation is lifted out into a series of its own, so it can carry a
      # tighter threshold than time.
      - name: Extract allocation per operation
        run: >
          .github/scripts/jmh-alloc-to-custom.py
          benchmark/build/results/jmh/results.json
          benchmark/build/results/jmh/alloc.json

      - name: Store allocation per operation
        uses: benchmark-action/github-action-benchmark@v1
        with:
          name: JMH alloc/op
          tool: customSmallerIsBetter
          output-file-path: benchmark/build/results/jmh/alloc.json
          github-token: ${{ secrets.GITHUB_TOKEN }}
          auto-push: true
          gh-pages-branch: gh-pages
          benchmark-data-dir-path: dev/bench
          alert-threshold: '120%'
          comment-on-alert: true
          fail-on-alert: false
          summary-always: true

      - name: Upload results
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: jmh-results
          path: benchmark/build/results/jmh/
          retention-days: 30
          if-no-files-found: ignore

  # validate() on a real, public project at a pinned commit (research table No.15). Synthetic
  # trees miss what real ones have: deep directories, uneven modules, real Kotlin to parse.
  #
  # katachi is not added to the project's build. The runner in :benchmark (source set
  # `realProject`) reads the checkout as a plain directory, with a coarse definition kept in
  # this repository, so the project's own Gradle, AGP and Kotlin versions never meet katachi's.
  # Violations are expected (the definition is coarse) and do not fail the job.
  real-project:
    name: real-project (nowinandroid)
    # After jmh, not beside it: both push to gh-pages, and the two would otherwise race.
    needs: jmh
    # Also when jmh failed: the two measure different things. Not when the run was cancelled.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      # Bump deliberately, together with the definition in
      # benchmark/src/realProject/kotlin/.../NowInAndroidArchitecture.kt. A new commit changes
      # the tree being measured, so expect one step in the chart when it moves.
      REAL_PROJECT_REPOSITORY: https://github.com/android/nowinandroid.git
      REAL_PROJECT_COMMIT: a49ed253d75e61a2b6ab80a8da677b57437b08eb
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # A shallow fetch of the one pinned commit. A git repository, not an export: the
      # definition uses `files = gitTracked()`, as a real project would.
      - name: Check out nowinandroid
        run: |
          dir="${RUNNER_TEMP}/nowinandroid"
          git init -q "${dir}"
          git -C "${dir}" remote add origin "${REAL_PROJECT_REPOSITORY}"
          git -C "${dir}" fetch -q --depth 1 origin "${REAL_PROJECT_COMMIT}"
          git -C "${dir}" checkout -q FETCH_HEAD
          echo "files: $(git -C "${dir}" ls-files | wc -l)"

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Measure validate()
        run: >
          ./gradlew :benchmark:measureRealProject
          -PrealProject.name=nowinandroid
          "-PrealProject.dir=${RUNNER_TEMP}/nowinandroid"
          -PrealProject.warmups=5
          -PrealProject.iterations=15
          --stacktrace

      - name: Store results
        uses: benchmark-action/github-action-benchmark@v1
        with:
          name: Real project (nowinandroid)
          tool: customSmallerIsBetter
          output-file-path: benchmark/build/results/real-project/nowinandroid.json
          github-token: ${{ secrets.GITHUB_TOKEN }}
          auto-push: true
          gh-pages-branch: gh-pages
          benchmark-data-dir-path: dev/bench
          alert-threshold: '150%'
          comment-on-alert: true
          fail-on-alert: false
          summary-always: true

      - name: Upload results
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: real-project-results
          path: benchmark/build/results/real-project/
          retention-days: 30
          if-no-files-found: ignore
