name: IDE plugin check

# `checkIdePlugin` (buildPlugin, test with the uiTest properties, verifyPreview) of
# katachi-intellij-plugin. It was a job of ci.yml; it takes too long for every pull request, so it
# runs only
#
#   - every night, on the default branch, and
#   - when somebody starts it: `workflow_dispatch`, on any branch.
#
# Run it on a branch before merging a change under katachi-intellij-plugin/ (or one that changes
# what the plugin reads from the root build), from the Actions tab ("Run workflow", pick the
# branch) or:
#
#   gh workflow run ide-plugin-check.yml --ref <branch>
#
# Starting it again does not cancel the run before it, so several runs of one branch can go side
# by side (what a flaky test needs). The heavier IDE checks (the property-based tests at scale,
# verifyPlugin, the Driver smokes on a real IDE) are ide-plugin-nightly.yml's. The job id
# `ide-plugin` is what .claude/skills/prerelease/scripts/run-ci-checks.py (step 8 of the
# prerelease) reads the commands from.

on:
  schedule:
    # 18:30 UTC = 03:30 JST, half an hour before ide-plugin-nightly.yml.
    - cron: '30 18 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # katachi-intellij-plugin is a standalone Gradle build (see its settings.gradle.kts), so the
  # root build never reaches it. checkIdePlugin runs `buildPlugin test verifyPreview`
  # through the plugin's own wrapper; `test` runs `uiTest` (the property-based and Compose UI
  # tests) as well.
  #
  # macOS, not ubuntu: the verifyPreview goldens under katachi-intellij-plugin/snapshots/preview
  # were rendered on macOS (Skia with the system's fonts and text shaping), and a Linux render does
  # not match them byte for byte. The label is pinned to the macOS the goldens were made on; bump it
  # together with an `updatePreview` run on the new version.
  #
  # `integrationTest` is not run here: it starts a real IDE through Starter and drives its windows,
  # which needs a display session and minutes of IDE start-up per run, and it opens sample/jvm
  # through a full Gradle import. ide-plugin-nightly.yml runs it, and it is a check to run by hand
  # before a release.
  ide-plugin:
    name: ide-plugin
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # The root build (which only configures here) runs on 17 like ci.yml's jobs; the plugin's
      # `jvmToolchain(21)` needs a 21, the JBR version the 261 platform runs on. The last one listed
      # becomes JAVA_HOME, which the plugin's wrapper inherits from the Exec task.
      #
      # The macOS runner has no Temurin in its tool cache, so setup-java downloads both from GitHub
      # releases, which can answer 504 for minutes at a time (setup-java's own retries span ~45 s).
      # When that happens, take the same versions from Zulu, which Azul serves from its own CDN:
      # nothing here asks for a vendor, so the build and the plugin's toolchain accept either.
      - name: Set up JDK 17 and 21
        id: setup-java
        continue-on-error: true
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: |
            17
            21

      - name: Set up JDK 17 and 21 (Zulu, when the Temurin download failed)
        if: steps.setup-java.outcome == 'failure'
        uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: |
            17
            21

      # Caches ~/.gradle, which holds the IntelliJ Platform SDK the plugin compiles against once it
      # has been downloaded (a whole IDE distribution, the slow part of a cold run).
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      # What the IntelliJ Platform Gradle Plugin keeps next to the build: the extracted platform
      # layout and the product release list it resolves the SDK with.
      - name: Cache .intellijPlatform
        uses: actions/cache@v5
        with:
          path: katachi-intellij-plugin/.intellijPlatform
          key: intellij-platform-${{ runner.os }}-${{ hashFiles('katachi-intellij-plugin/gradle/libs.versions.toml', 'katachi-intellij-plugin/settings.gradle.kts') }}
          restore-keys: |
            intellij-platform-${{ runner.os }}-

      - name: Check katachi-intellij-plugin
        run: ./gradlew checkIdePlugin --stacktrace

      # The test reports, the shrunk counterexample and its PNG of a failing property
      # (build/uiTest-failures), and every PNG verifyPreview rendered (build/preview): a failing
      # gate (e.g. "text is cut") stops before the before/after report is written, and the PNGs
      # this runner drew are what tells a font difference from a real overflow.
      - name: Upload reports
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: ide-plugin-reports
          path: |
            katachi-intellij-plugin/build/reports/
            katachi-intellij-plugin/build/test-results/
            katachi-intellij-plugin/build/uiTest-failures/
            katachi-intellij-plugin/build/preview/
          retention-days: 7
          if-no-files-found: ignore
