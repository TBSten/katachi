name: Feature request
description: Suggest something katachi should be able to do.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the idea! English or Japanese are both fine. / 日本語でも大丈夫です。
        Check the [roadmap](https://tbsten.github.io/katachi/roadmap/) first; it may already be planned.
  - type: textarea
    id: problem
    attributes:
      label: What you want to do
      description: The rule or workflow you could not express with katachi today, and why it matters in your project.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: How you imagine it
      description: A sketch of the DSL, the output, or the behavior you would like.
      render: kotlin
  - type: textarea
    id: workaround
    attributes:
      label: Current workaround
      description: What you do now instead, if anything.
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Core DSL / layout check
        - Konsist / Konture integration
        - Gradle plugin
        - Document generation / processors
        - Templates / code generation
        - IntelliJ plugin
        - Install kit
        - Docs
        - Other / not sure
  - type: textarea
    id: extra
    attributes:
      label: Anything else
