name: Add showcase request
description: Tell us about a project that uses katachi, so we can list it on the site.
title: "[Showcase]: "
labels: ["showcase"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for using katachi! English or Japanese are both fine. / 日本語でも大丈夫です。
        We read every request, and we may list your project on the docs site.
  - type: input
    id: name
    attributes:
      label: Project name
    validations:
      required: true
  - type: input
    id: url
    attributes:
      label: Project URL
      description: App store page or website. Private projects are welcome too; leave this empty and describe it below.
  - type: input
    id: repository
    attributes:
      label: Repository URL (optional)
      description: If the source is public, a link to the repository, ideally to the file with the architecture definition.
      placeholder: https://github.com/owner/repo
  - type: dropdown
    id: project-type
    attributes:
      label: Project type
      multiple: true
      options:
        - Android
        - Kotlin Multiplatform
        - JVM / server-side
        - Library
        - Other
  - type: textarea
    id: how
    attributes:
      label: How you use katachi
      description: What you check with it (layout, roles, Konsist / Konture constraints, generated docs, templates ...). A snippet of your architecture definition is welcome.
    validations:
      required: true
  - type: textarea
    id: impressions
    attributes:
      label: Pros, cons, and impressions
      description: What worked well, what was hard, and what you would like to change.
    validations:
      required: true
  - type: checkboxes
    id: consent
    attributes:
      label: Listing
      options:
        - label: I am allowed to share this project, and katachi may list its name and URL on the docs site.
          required: true
