# Catalog for the dependencies that only sample/android needs; read as `sampleLibs`.
#
# Kotlin, katachi and kotest are NOT declared here. They come from the repository root
# catalog (`../../gradle/libs.versions.toml`, read as `libs`) so that the sample can
# never disagree with the library it is testing.

# AndroidX versions are not simply "the newest". AGP 9.1.0 supports compileSdk 36 at most
# (see README.md), and every AAR declares the compileSdk it needs. The versions below are
# the newest whose `minCompileSdk` is still <= 36; the next release of each one requires
# 37 and fails the build with "requires libraries and applications that depend on it to
# compile against version 37 or later of the Android APIs". Check before bumping:
#   unzip -p <artifact>.aar META-INF/com/android/build/gradle/aar-metadata.properties
[versions]
agp = "9.1.0"
androidxActivity = "1.12.4"
androidxCore = "1.18.0"
androidxLifecycle = "2.10.0"
androidxNavigation = "2.9.8"
# Compose 1.11.4 / Material3 1.4.0.
composeBom = "2026.06.01"
# Matches the JUnit Platform 1.13.4 that kotest 6.2.5 already puts on the test classpath.
# Only `:architecture-test` uses it, for the single plain JUnit test a user would write.
junitJupiter = "5.13.4"

[libraries]
androidxActivityCompose = { module = "androidx.activity:activity-compose", version.ref = "androidxActivity" }
androidxCoreKtx = { module = "androidx.core:core-ktx", version.ref = "androidxCore" }
androidxLifecycleRuntimeCompose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "androidxLifecycle" }
androidxLifecycleViewModelCompose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "androidxLifecycle" }
androidxNavigationCompose = { module = "androidx.navigation:navigation-compose", version.ref = "androidxNavigation" }
# The BOM is applied with `implementation(platform(...))`; every other Compose artifact
# below is then declared without a version and gets it from here.
composeBom = { module = "androidx.compose:compose-bom", version.ref = "composeBom" }
composeMaterial3 = { module = "androidx.compose.material3:material3" }
composeRuntime = { module = "androidx.compose.runtime:runtime" }
composeUi = { module = "androidx.compose.ui:ui" }
# `ui-tooling` is `debugImplementation` only: it carries the preview renderer and must
# not ship in release. `ui-tooling-preview` is the `@Preview` annotation itself, so it
# is a normal `implementation`.
composeUiTooling = { module = "androidx.compose.ui:ui-tooling" }
composeUiToolingPreview = { module = "androidx.compose.ui:ui-tooling-preview" }
# The aggregate artifact: `junit-jupiter-api` to compile against plus the engine that runs
# it. Declaring only the API would compile and then run nothing.
junitJupiter = { module = "org.junit.jupiter:junit-jupiter", version.ref = "junitJupiter" }

[plugins]
androidApplication = { id = "com.android.application", version.ref = "agp" }
androidLibrary = { id = "com.android.library", version.ref = "agp" }
