# Reuse outputs of previous successful builds.
org.gradle.caching=true
# Reuse the configuration phase. AGP 9.4.1 supports it; no opt-out needed here.
org.gradle.configuration-cache=true
# Give the daemon enough heap/metaspace for the Kotlin compiler and the kotest runner.
# Same value as the repository root, so the composite build behaves the same either way.
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g

android.useAndroidX=true
kotlin.code.style=official
