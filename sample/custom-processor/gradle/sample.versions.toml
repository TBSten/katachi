# Dependencies that only this sample needs.
#
# Kotlin, katachi and kotest are NOT here on purpose: they come from the root catalog
# (`../../gradle/libs.versions.toml`, read as `libs`), which is their single source of
# truth for every sample.

[versions]
# Matches the junit-platform 1.13.4 that kotest-runner-junit5 6.2.5 brings in, so the two
# engines agree on the platform they register with.
junitJupiter = "5.13.4"

[libraries]
# The aggregate artifact: `junit-jupiter-api` to compile against plus the engine that runs
# the test. kotest-runner-junit5 puts the API on the compile classpath but registers only
# kotest's own engine, and `ProjectArchitectureTest` is a plain JUnit test -- the form a user
# writes -- so without the Jupiter engine it would be discovered by nothing and silently
# never run.
junitJupiter = { module = "org.junit.jupiter:junit-jupiter", version.ref = "junitJupiter" }
