# Version catalog is a central place for you to declare and version dependencies
# https://docs.gradle.org/current/userguide/platforms.html#sub:version-catalog
# https://docs.gradle.org/current/userguide/platforms.html#sub::toml-dependencies-format
#
# This catalog is the single source of truth for the Kotlin, katachi and kotest versions.
# Each sample under `sample/` reads it as `libs` and keeps its own catalog (`sampleLibs`)
# for the dependencies that only that sample needs (Ktor, AGP, ...).

[versions]
katachi = "0.1.1"
kotlin = "2.4.10"
kotest = "6.2.5"
# The Kotlin parser behind `konsist { }`. Only `:katachi-konsist` and the samples that use it
# see this; `:katachi` itself depends only on kotlinx.serialization (below), for decoding
# processor arguments.
konsist = "0.17.3"
# processor の引数デコード。`:katachi` の唯一の実行時依存。**1.9.0 から上げない。**
# 1.9.0 は kotlin-stdlib 2.2.0 に依存する最後の系列で、1.10.0 は 2.3.0、1.11.0 は 2.3.20 を
# 引き連れる（Maven Central の POM で確認）。katachi は Kotlin 2.2 の利用者が読める metadata で
# 出すために languageVersion / apiVersion / coreLibrariesVersion を 2.2 に固定しているので、
# 2.3 系の stdlib を推移的に持ち込むとその固定が意味を失う。
kotlinxSerialization = "1.9.0"
# 公開まわり。`:katachi` / `:katachi-konsist` / `:katachi-gradle-plugin` の3つだけを Maven Central に出す。
vanniktechPublish = "0.37.0"
# javadoc jar を作るのに要る。Central は sources と javadoc の両方を必須にしている。
dokka = "2.2.0"
# `:katachi-gradle-plugin` のテスト用。このリポジトリで JUnit を直接引くのはそこだけで、
# ほかは kotest 経由。あのモジュールは Java だけで書かれていて kotest を使えない
# （Kotlin plugin を付けると kotlin-stdlib が POM に載る）。
junit = "5.14.4"

[libraries]
# katachi itself. Samples depend on it as `testImplementation(libs.katachi)`; the
# `includeBuild("../..")` in their settings substitutes this module with the local build.
katachi = { module = "me.tbsten.katachi:katachi", version.ref = "katachi" }
# The konsist backend, substituted the same way `katachi` is. A sample only needs it when its
# definition writes `konsist { }`.
katachiKonsist = { module = "me.tbsten.katachi:katachi-konsist", version.ref = "katachi" }
konsist = { module = "com.lemonappdev:konsist", version.ref = "konsist" }
# `KSerializer` / `AbstractDecoder` / `buildClassSerialDescriptor` だけを使う。json は要らない。
kotlinxSerializationCore = { module = "org.jetbrains.kotlinx:kotlinx-serialization-core", version.ref = "kotlinxSerialization" }
kotlinGradlePlugin = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }
# convention plugin から適用するため、plugin の marker artifact をライブラリとしても引く。
# `plugins { }` の alias だけでは buildSrc のクラスパスに乗らない。
vanniktechPublishPlugin = { module = "com.vanniktech:gradle-maven-publish-plugin", version.ref = "vanniktechPublish" }
dokkaPlugin = { module = "org.jetbrains.dokka:dokka-gradle-plugin", version.ref = "dokka" }
# `:tool:dokka`（このリポジトリの API リファレンス用の Dokka プラグイン）が使う。
# 本体は Dokka の実行時に Dokka 自身が持っているので compileOnly、残りはテスト用。
dokkaCore = { module = "org.jetbrains.dokka:dokka-core", version.ref = "dokka" }
dokkaBase = { module = "org.jetbrains.dokka:dokka-base", version.ref = "dokka" }
dokkaTemplating = { module = "org.jetbrains.dokka:templating-plugin", version.ref = "dokka" }
dokkaAllModulesPage = { module = "org.jetbrains.dokka:all-modules-page-plugin", version.ref = "dokka" }
dokkaTestApi = { module = "org.jetbrains.dokka:dokka-test-api", version.ref = "dokka" }
dokkaBaseTestUtils = { module = "org.jetbrains.dokka:dokka-base-test-utils", version.ref = "dokka" }
dokkaAnalysisKotlinSymbols = { module = "org.jetbrains.dokka:analysis-kotlin-symbols", version.ref = "dokka" }
# `:tool:dokka` の `hierarchical-no-link` のサイドバーが HTML を組むのに使う。dokka-base が runtime
# スコープで持つ版（dokka-base 2.2.0 の POM）に合わせる。Dokka を上げたら一緒に確かめる。
dokkaKotlinxHtml = { module = "org.jetbrains.kotlinx:kotlinx-html-jvm", version = "0.9.1" }
# JUnit 5。version を書かないものは BOM に決めさせる。
junitBom = { module = "org.junit:junit-bom", version.ref = "junit" }
junitJupiter = { module = "org.junit.jupiter:junit-jupiter" }
junitJupiterParams = { module = "org.junit.jupiter:junit-jupiter-params" }
# Gradle 9 は JUnit Platform の launcher を自分では足さない。
junitPlatformLauncher = { module = "org.junit.platform:junit-platform-launcher" }
kotestRunnerJunit5 = { module = "io.kotest:kotest-runner-junit5", version.ref = "kotest" }
kotestAssertionsCore = { module = "io.kotest:kotest-assertions-core", version.ref = "kotest" }
# Not needed on the JVM (the JUnit 5 runner pulls the engine in). Kept for non-JVM
# targets, where the engine has to be declared explicitly.
kotestFrameworkEngine = { module = "io.kotest:kotest-framework-engine", version.ref = "kotest" }

[plugins]
kotlinJvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlinAndroid = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlinMultiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
kotlinPluginSerialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
# The Compose compiler plugin has to match the Kotlin version exactly. It lives here, not
# in a sample's own catalog, because a TOML catalog cannot reference another one: writing
# it per sample would duplicate the Kotlin version and let the two drift apart silently.
kotlinPluginCompose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
vanniktechPublish = { id = "com.vanniktech.maven.publish", version.ref = "vanniktechPublish" }
dokka = { id = "org.jetbrains.dokka", version.ref = "dokka" }
